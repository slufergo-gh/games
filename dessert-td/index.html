<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>我們這一家大戰甜點</title>
<style>
:root{
  --ink:#4a2c1a; --cream:#fff6e6; --pink:#ff8fb1; --pinkd:#e0628c; --mint:#8fe0c4; --gold:#ffcf4a;
  --panel:#fff3dd; --wood:#b97a46; --woodd:#8a5530;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
html,body{margin:0;height:100%;background:#2a1a12;overflow:hidden;touch-action:none;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none}
#wrap{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;
  transform:translate(-50%,-50%);background:#2a1a12;overflow:hidden;border-radius:6px}
#cv{position:absolute;left:0;top:0;width:1280px;height:720px;display:block}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.scr.on{display:flex}
.btn{font:inherit;font-weight:800;font-size:24px;color:#fff;background:linear-gradient(#ff9fc0,#ec6f98);
  border:4px solid #fff;border-radius:22px;padding:12px 34px;margin:8px;cursor:pointer;
  box-shadow:0 6px 0 #b9466f,0 10px 18px rgba(0,0,0,.25);text-shadow:0 2px 0 #b9466f;min-width:220px}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b9466f}
.btn.g{background:linear-gradient(#8fe7c9,#41bf95);box-shadow:0 6px 0 #2a8a69,0 10px 18px rgba(0,0,0,.25);text-shadow:0 2px 0 #2a8a69}
.btn.y{background:linear-gradient(#ffe07a,#f5b928);box-shadow:0 6px 0 #b8841a,0 10px 18px rgba(0,0,0,.25);text-shadow:0 2px 0 #b8841a}
.btn.s{font-size:18px;padding:8px 20px;min-width:0;border-width:3px}
.btn:disabled{filter:grayscale(1) brightness(.85);cursor:default;transform:none}
.card{background:var(--panel);border:5px solid #fff;border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.35);padding:24px 30px}
h1.logo{font-size:64px;margin:0 0 4px;color:#fff;letter-spacing:4px;
  text-shadow:0 5px 0 #e0628c,0 -3px 0 #e0628c,4px 0 0 #e0628c,-4px 0 0 #e0628c,0 10px 20px rgba(0,0,0,.4)}
.sub{color:#fff;font-size:20px;margin-bottom:18px;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.title-bg{background:#3a2240 url(assets/images/cover.jpg) center/cover no-repeat;justify-content:flex-start;align-items:stretch}
.title-bg::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(30,12,30,.55) 0,rgba(30,12,30,.15) 34%,rgba(0,0,0,0) 50%),linear-gradient(rgba(30,12,30,.5) 0,rgba(0,0,0,0) 26%);pointer-events:none}
.title-bg>*{position:relative}
.title-head{text-align:center;padding-top:26px}
.title-menu{display:flex;flex-direction:column;align-items:flex-start;padding:22px 0 0 44px}
.title-menu .btn{min-width:300px}
.title-menu .btn.s{min-width:0;margin-left:0;margin-right:16px}
.title-menu .row{margin-top:6px}
.title-menu .row{justify-content:flex-start}
.charrow{display:flex;gap:4px;margin:6px 0 14px;height:110px;align-items:flex-end}
.charrow img{height:96px;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.map-bg{background:linear-gradient(#ffe6ef,#ffd2a8)}
.map{display:flex;flex-direction:column;gap:14px;width:1100px}
.scene{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.7);border-radius:22px;padding:12px 18px;border:4px solid #fff}
.scene .nm{width:150px;font-size:22px;font-weight:900}
.scene .nm small{display:block;font-size:14px;font-weight:600;opacity:.7}
.lv{width:120px;height:86px;border-radius:18px;border:4px solid #fff;font:inherit;font-size:26px;font-weight:900;cursor:pointer;
  background:linear-gradient(#ffc2d6,#ff8fb1);color:#fff;text-shadow:0 2px 0 #c0507a;position:relative;box-shadow:0 5px 0 #c0507a}
.lv.n{background:linear-gradient(#a9b4ff,#6c79e0);text-shadow:0 2px 0 #3d47a0;box-shadow:0 5px 0 #3d47a0}
.lv.k{background:linear-gradient(#fff0c2,#f7c96b);color:#8a5530;text-shadow:none;box-shadow:0 5px 0 #b8841a}
.lv.boss{width:220px;background:linear-gradient(#ff8a8a,#c93a3a);box-shadow:0 5px 0 #7d1f1f;text-shadow:0 2px 0 #7d1f1f;font-size:22px}
.lv:disabled{filter:grayscale(1);opacity:.55;cursor:default}
.lv .ck{position:absolute;right:-8px;top:-10px;background:#3bc48a;border:3px solid #fff;border-radius:50%;width:30px;height:30px;font-size:18px;line-height:24px;color:#fff;text-shadow:none}
.lv small{display:block;font-size:12px;font-weight:700;margin-top:2px}
.topbar{position:absolute;top:14px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center}
.sel-wrap{display:flex;gap:18px;width:1200px;height:600px}
.sel-left{flex:1;display:flex;flex-direction:column}
.sel-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;overflow:auto;padding:4px}
.pick{background:#fff;border:4px solid #f1d7b8;border-radius:16px;padding:6px 4px 4px;text-align:center;cursor:pointer;position:relative}
.pick img{height:74px;max-width:100%;object-fit:contain}
.pick .pn{font-size:14px;font-weight:800;white-space:nowrap}
.pick .pr{font-size:12px;opacity:.75}
.pick .pc{position:absolute;left:6px;top:4px;background:#59c2ff;color:#fff;border-radius:10px;padding:0 6px;font-size:13px;font-weight:900}
.pick.on{border-color:#ff8fb1;background:#ffe5ee;opacity:.5}
.tray{display:flex;gap:8px;min-height:120px;background:linear-gradient(#ffd0de,#ffb3c9);border:4px solid #ff8fb1;border-radius:18px;padding:8px;margin-bottom:10px;box-shadow:0 4px 0 #e0628c}
.sec-h{font-size:18px;font-weight:900;margin:0 0 6px 4px;display:flex;align-items:center;gap:8px}
.sec-h small{font-size:13px;font-weight:700;opacity:.65}
.sec-h.go{color:#d0457a}.sec-h.stay{color:#6b4a2f;margin-top:2px}
.sel-grid{background:rgba(138,85,48,.12);border-radius:18px;padding:8px !important}
.pick .badge{position:absolute;right:6px;top:4px;background:#ff8fb1;color:#fff;border-radius:10px;padding:0 6px;font-size:12px;font-weight:900}
.tray .pick{width:96px;opacity:1}
.tray .slot{width:96px;border:3px dashed rgba(138,85,48,.35);border-radius:16px}
.sel-right{width:300px;display:flex;flex-direction:column;gap:10px}
.info{background:#fff;border-radius:18px;padding:14px;font-size:15px;line-height:1.5;flex:1;overflow:auto}
.info b{font-size:20px}
.ov{position:absolute;inset:0;background:rgba(40,20,10,.55);display:none;align-items:center;justify-content:center;flex-direction:column}
.ov.on{display:flex}
.res-title{font-size:56px;font-weight:900;color:#fff;margin:0 0 8px;text-shadow:0 5px 0 #e0628c,0 10px 20px rgba(0,0,0,.4)}
.res-title.lose{text-shadow:0 5px 0 #7b4a2a,0 10px 20px rgba(0,0,0,.4)}
.newfriend{display:flex;align-items:center;gap:18px;background:#fff;border-radius:20px;padding:12px 24px;margin:8px 0 14px}
.newfriend img{height:110px}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.codex{width:1200px;height:610px;display:flex;flex-direction:column}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab{font:inherit;font-weight:800;font-size:18px;border:3px solid #fff;border-radius:14px;padding:6px 18px;background:#f4d9b9;color:var(--ink);cursor:pointer}
.tab.on{background:#ff8fb1;color:#fff}
.tbl-wrap{flex:1;overflow:auto;background:#fff;border-radius:18px;padding:6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{position:sticky;top:0;background:#ffe2ec;padding:6px 6px;text-align:left;font-size:13px;white-space:nowrap;z-index:1}
td{border-top:1px solid #f3e3d0;padding:4px 6px;vertical-align:middle}
td img,td canvas{height:52px;display:block}
td.d{font-size:12.5px;opacity:.8;max-width:260px}
.intro-grid{margin-top:58px;width:1220px;height:630px;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:min-content;gap:12px;overflow:auto;padding:4px}
.ic{background:#fff;border:4px solid #fff;border-radius:22px;box-shadow:0 6px 0 rgba(138,85,48,.18);display:flex;gap:10px;padding:10px 12px;align-items:flex-start}
.ic img{width:84px;height:96px;object-fit:contain;flex:none;animation:bob 1.8s ease-in-out infinite}
.ic .nm{font-size:19px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ic .tag{font-size:12px;font-weight:800;color:#fff;background:#ff8fb1;border-radius:10px;padding:1px 8px}
.ic .cost{font-size:12px;font-weight:800;color:#fff;background:#59c2ff;border-radius:10px;padding:1px 8px}
.ic .tx{font-size:13.5px;line-height:1.55;margin-top:4px}
.ic.lock{opacity:.6}.ic.lock img{filter:brightness(0) opacity(.35);animation:none}
.set-row{display:flex;align-items:center;gap:14px;margin:12px 0;font-size:20px;font-weight:700}
.set-row input[type=range]{width:260px;accent-color:#ec6f98}
.set-row input[type=checkbox]{width:26px;height:26px;accent-color:#ec6f98}
.note{font-size:14px;opacity:.75;max-width:520px;line-height:1.5}
#rot{position:fixed;inset:0;background:#2a1a12;color:#fff;display:none;align-items:center;justify-content:center;font-size:22px;text-align:center;z-index:9}
@media (orientation:portrait) and (max-width:700px){#rot{display:flex}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="1280" height="720"></canvas>

  <!-- 標題 -->
  <div class="scr title-bg on" id="s-title">
    <div class="title-head">
      <h1 class="logo">我們這一家大戰甜點</h1>
      <div class="sub">甜點大軍要來吃掉我們的家了！排好吉祥物，守住家門！</div>
    </div>
    <div class="charrow" id="title-chars" style="display:none"></div>
    <div class="title-menu">
    <button class="btn" id="b-start">開始冒險</button>
    <button class="btn y" id="b-endless">無盡模式</button>
    <div class="row">
      <button class="btn g s" id="b-intro">角色介紹</button>
      <button class="btn g s" id="b-set">設定</button>
    </div>
    </div>
  </div>

  <!-- 關卡地圖 -->
  <div class="scr map-bg" id="s-map">
    <div class="topbar"><button class="btn s g" data-go="title">← 回標題</button><div style="font-size:28px;font-weight:900">選擇關卡</div><div style="width:120px"></div></div>
    <div class="map" id="map"></div>
  </div>

  <!-- 選角 -->
  <div class="scr map-bg" id="s-select">
    <div class="topbar"><button class="btn s g" data-go="map">← 回地圖</button><div style="font-size:28px;font-weight:900" id="sel-title">選擇出戰夥伴</div><div style="width:120px"></div></div>
    <div class="sel-wrap" style="margin-top:50px">
      <div class="sel-left">
        <div class="sec-h go">⚔ 出戰隊伍 <span id="tray-n"></span><small>點一下可以移回休息</small></div>
        <div class="tray" id="tray"></div>
        <div class="sec-h stay">🏠 休息夥伴<small>點一下加入出戰隊伍</small></div>
        <div class="sel-grid" id="sel-grid"></div>
      </div>
      <div class="sel-right">
        <div class="info" id="sel-info"></div>
        <button class="btn" id="b-go">開戰！</button>
      </div>
    </div>
  </div>

  <!-- 圖鑑 -->
  <div class="scr map-bg" id="s-codex">
    <div class="topbar"><button class="btn s g" data-go="set">← 回設定</button><div style="font-size:28px;font-weight:900">數值表</div><div style="width:120px"></div></div>
    <div class="codex" style="margin-top:56px">
      <div class="tabs"><button class="tab on" data-tab="def">吉祥物</button><button class="tab" data-tab="ene">甜點大軍</button><button class="tab" data-tab="lvl">關卡</button></div>
      <div class="tbl-wrap" id="codex-body"></div>
    </div>
  </div>

  <!-- 角色介紹 -->
  <div class="scr map-bg" id="s-intro">
    <div class="topbar"><button class="btn s g" data-go="title">← 回標題</button><div style="font-size:28px;font-weight:900">夥伴介紹</div><div style="width:120px"></div></div>
    <div class="intro-grid" id="intro-grid"></div>
  </div>

  <!-- 設定 -->
  <div class="scr map-bg" id="s-set">
    <div class="card" style="min-width:560px">
      <div style="font-size:30px;font-weight:900;margin-bottom:8px">設定</div>
      <div class="set-row">音樂 <input type="range" min="0" max="1" step="0.05" id="v-music"></div>
      <div class="set-row">音效 <input type="range" min="0" max="1" step="0.05" id="v-sfx"></div>
      <div class="set-row"><input type="checkbox" id="v-auto"> 自動收集泡泡</div>
      <div class="set-row"><input type="checkbox" id="v-sky"> 新手模式：夜晚關卡天上也會持續掉泡泡</div>
      <div class="set-row"><input type="checkbox" id="v-test"> 測試模式（全部關卡與角色解鎖）</div>
      <div class="note">測試模式方便調平衡用，關掉後會回到原本的進度。<br>「數值表」可以看所有角色、甜點和關卡的數值。數值都在遊戲資料夾裡的 config.js，改完重新整理頁面就會生效。</div>
      <div class="row" style="margin-top:14px">
        <button class="btn s y" id="b-codex">數值表</button>
        <button class="btn s y" id="b-retut">重看教學</button>
        <button class="btn s" id="b-reset">清除存檔</button>
        <button class="btn s g" data-go="title">完成</button>
      </div>
    </div>
  </div>

  <!-- 暫停 -->
  <div class="ov" id="o-pause">
    <div class="card" style="text-align:center;min-width:420px">
      <div style="font-size:36px;font-weight:900;margin-bottom:6px">暫停</div>
      <div class="set-row" style="justify-content:center">音樂 <input type="range" min="0" max="1" step="0.05" id="p-music"></div>
      <div class="set-row" style="justify-content:center">音效 <input type="range" min="0" max="1" step="0.05" id="p-sfx"></div>
      <button class="btn g" id="b-resume">繼續</button><br>
      <button class="btn s y" id="b-restart">重新開始</button>
      <button class="btn s" id="b-quit">回到地圖</button>
    </div>
  </div>

  <!-- 結算 -->
  <div class="ov" id="o-result">
    <div class="res-title" id="res-title"></div>
    <div id="res-body" style="color:#fff;font-size:22px;font-weight:700;text-shadow:0 2px 4px rgba(0,0,0,.6);margin-bottom:8px;text-align:center"></div>
    <div class="row" id="res-btns"></div>
  </div>
</div>
<div id="rot">請把手機轉成橫向來玩 ↻</div>

<script src="config.js"></script>
<script>
'use strict';
// ======================================================================
//  基本設定
// ======================================================================
const C = window.CONFIG, G = C.global, D = C.defenders, E = C.enemies;
const W = 1280, H = 720, BX = 150, BY = 135, CW = 110, CH = 114, ROWS = 5, COLS = 9;
const BR = BX + CW * COLS; // 場地右緣
const BOSS_X = 1135;
const SCENES = [
  { name: '客廳', sub: '白天', night: false, bgm: 'stage1' },
  { name: '臥室', sub: '夜晚・天上不掉泡泡', night: true, bgm: 'stage2' },
  { name: '廚房', sub: '白天・甜點大本營', night: false, bgm: 'stage3' },
];
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const colX = c => BX + c * CW + CW / 2;
const rowY = r => BY + r * CH + CH / 2;
const rowBottom = r => BY + r * CH + CH - 10;

const IMG = {};
for (const k in D) { const i = new Image(); i.src = 'assets/images/' + D[k].img; IMG[k] = i; }
const imgOk = i => i && i.complete && i.naturalWidth > 0;

// ======================================================================
//  存檔
// ======================================================================
function defaultSave() { return { cleared: [], endlessBest: 0, music: 0.6, sfx: 0.7, test: false, lastPick: [], tutorialDone: false }; }
function loadSave() { try { const s = JSON.parse(localStorage.getItem('wjtd_save')); if (s) return Object.assign(defaultSave(), s); } catch (e) {} return defaultSave(); }
function persist() { try { localStorage.setItem('wjtd_save', JSON.stringify(save)); } catch (e) {} }
let save = loadSave();
function unlockedDefs() {
  if (save.test) return Object.keys(D);
  const u = [...C.startUnlocked];
  for (const L of C.levels) if (L.unlock && save.cleared.includes(L.id) && !u.includes(L.unlock)) u.push(L.unlock);
  return Object.keys(D).filter(k => u.includes(k));
}
function levelOpen(i) { return save.test || i === 0 || save.cleared.includes(C.levels[i - 1].id); }
function endlessOpen() { return save.test || save.cleared.includes('3-5'); }

// ======================================================================
//  音樂與音效
// ======================================================================
const BGM = {}; let bgmKey = null;
function playBgm(k, loop = true) {
  if (bgmKey === k) { const a = BGM[k]; if (a && a.paused) a.play().catch(() => {}); return; }
  if (bgmKey && BGM[bgmKey]) BGM[bgmKey].pause();
  bgmKey = k; if (!k) return;
  if (!BGM[k]) BGM[k] = new Audio('assets/audio/' + k + '.mp3');
  const a = BGM[k]; a.loop = loop; a.volume = save.music; a.currentTime = 0; a.play().catch(() => {});
}
function setMusicVol(v) { save.music = v; for (const k in BGM) BGM[k].volume = v; persist(); }
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type = 'sine', v = 0.2, f2, delay = 0) {
  const a = ac(); if (!a || save.sfx <= 0) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v * save.sfx, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + 0.02);
}
let noiseBuf = null;
function noise(d, v = 0.3, freq = 800) {
  const a = ac(); if (!a || save.sfx <= 0) return;
  if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(v * save.sfx, a.currentTime); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + d);
  s.connect(f).connect(g).connect(a.destination); s.start(); s.stop(a.currentTime + d);
}
const sfxLast = {};
function sfx(name) {
  const now = performance.now(); if (sfxLast[name] && now - sfxLast[name] < 45) return; sfxLast[name] = now;
  switch (name) {
    case 'shoot': tone(820, 0.08, 'triangle', 0.07, 520); break;
    case 'ice': tone(1400, 0.12, 'sine', 0.07, 900); break;
    case 'lob': tone(300, 0.15, 'sine', 0.08, 600); break;
    case 'pop': tone(520, 0.14, 'sine', 0.22, 1150); break;
    case 'hit': noise(0.05, 0.1, 2500); break;
    case 'armor': tone(1600, 0.05, 'square', 0.04, 1200); break;
    case 'chomp': noise(0.12, 0.25, 700); tone(160, 0.1, 'square', 0.06, 90); break;
    case 'boom': noise(0.7, 0.55, 380); tone(110, 0.5, 'sine', 0.3, 40); break;
    case 'place': tone(220, 0.12, 'square', 0.1, 130); break;
    case 'fire': noise(0.35, 0.14, 1400); break;
    case 'heal': tone(880, 0.15, 'sine', 0.06, 1320); break;
    case 'up': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, 'triangle', 0.15, null, i * 0.07)); break;
    case 'alarm': [0, 0.35, 0.7].forEach(t => tone(600, 0.3, 'sawtooth', 0.08, 900, t)); break;
    case 'mower': noise(1.0, 0.18, 500); tone(90, 1, 'sawtooth', 0.05, 140); break;

let S = null;
function startGame(li, pk) {
  const L = levelDef(li), sc = SCENES[L.scene];
  S = {
    li, L, sc, picks: pk, time: 0, speed: 1, paused: false, over: false, endT: 0,

    defs: [], enemies: [], projs: [], parts: [], texts: [], skyB: [], hazards: [], flames: [],
    mowers: Array.from({ length: ROWS }, (_, r) => ({ r, x: BX - 52, st: 'idle' })),
    cards: pk.map(k => ({ k, cd: D[k].cooldown >= 20 ? D[k].cooldown * 0.5 : 0 })),
    sel: null, tool: null, mx: -1, my: -1,
    wave: 0, waveT: G.firstWave, spawnQ: [], skyT: rand(4, 7),

  if (!L.boss && !L.endless) for (let f = 1; f <= L.flags; f++) S.bigWaves.push(Math.round(L.waves * f / L.flags) - 1);
  if (L.boss) S.boss = { hp: E.boss.hp, max: E.boss.hp, throwT: E.boss.throwEvery * 2, sumT: E.boss.summonEvery * 2, flash: 0, anim: 0, dead: false };
  $('o-pause').classList.remove('on'); $('o-result').classList.remove('on');

function isBig(i) { return S.L.endless ? (i + 1) % S.L.bigEvery === 0 : S.bigWaves.includes(i); }
function lastWave() { return !S.L.endless && !S.L.boss && S.wave >= S.totalWaves; }

// ---------------- 波次 ----------------
function makeWave(i) {
  const L = S.L;
  let budget = L.b0 + i * L.bg; const big = isBig(i);
  if (big) budget = budget * C.bigWaveMult + 2;
  budget = Math.max(1, Math.round(budget));
  const list = []; let guard = 0;
  while (budget > 0 && guard++ < 200) {
    const can = L.pool.filter(k => E[k].points <= budget);
    if (!can.length) break;
    const k = can[Math.floor(Math.random() * can.length)];
    list.push(k); budget -= E[k].points;
  }
  const spread = big ? Math.min(9, 2 + list.length * 0.3) : Math.min(7, 1 + list.length * 0.6);
  list.forEach((k, j) => S.spawnQ.push({ k, t: (j === 0 ? 0 : rand(0, spread)), r: Math.floor(Math.random() * ROWS) }));
  if (big) { banner(S.L.endless || i < S.totalWaves - 1 ? '一大波甜點即將來襲！' : '最後一波！', '#ff5a7a'); sfx('alarm'); }
}
function banner(text, color = '#fff', t = 2.6) { S.banner = { text, color, t, max: t }; }

// ---------------- 甜點 ----------------
function makeEnemy(k, r, x) {
  const d = E[k];
  return { k, r, x, hp: d.hp, max: d.hp, armor: d.armor || 0, maxArmor: d.armor || 0, speed: d.speed, slowT: 0, flash: 0,
    eating: false, dead: false, deadT: 0, phase: Math.random() * 6, hop: 0, state: 'walk', jumped: false, rolling: k === 'donut',
    mini: false, frostIn: 0, ang: 0 };
}
function spawnEnemy(k, r, x = W + 40) { const e = makeEnemy(k, r, x); S.enemies.push(e); return e; }
function hurt(e, dmg, o = {}) {
  if (e.dead) return;
  e.flash = 0.1;
  if (e.armor > 0 && !o.lob) {
    const a = Math.min(e.armor, dmg); e.armor -= a; dmg -= a;
    if (!o.quiet) sfx('armor');
    if (e.armor <= 0) burst(e.x, rowBottom(e.r) - 90, e.k === 'chocolate' ? '#6b3b1f' : '#9fe3c6', 10);
  }
  if (dmg > 0) { e.hp -= dmg; if (!o.quiet) sfx('hit'); }
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
  if (e.dead) return;
  e.dead = true; e.deadT = 0.6; e.hp = 0;
  const col = { cupcake: '#ffb3cb', macaron: '#ffb3cb', chocolate: '#ffb3cb', donut: '#f6a6c8', lollipop: '#ff6f91', pudding: '#ffd86b', icecream: '#ffe1ee', popcorn: '#fff4cc', cake: '#fff' }[e.k] || '#fff';
  burst(e.x, rowBottom(e.r) - 40, col, 12);
  if (!e.eaten && Math.random() < (G.killDropChance || 0)) S.skyB.push({ x: e.x, y: rowBottom(e.r) - 60, vy: -180, ty: rowBottom(e.r) - rand(10, 30), v: G.killDropValue, life: G.bubbleLife, kind: 'pop', vx: rand(-40, 40), fly: 0 });
  if (e.k === 'pudding' && !e.mini) {
    for (let i = 0; i < E.pudding.split; i++) {
      const m = spawnEnemy('pudding', e.r, e.x + (i ? 24 : -14));
      m.mini = true; m.hp = m.max = E.pudding.splitHp; m.speed = E.pudding.splitSpeed;
    }
  }
}
function hurtBoss(dmg) {
  const b = S.boss; if (!b || b.dead) return;
  b.hp -= dmg; b.flash = 0.1; sfx('hit');
  if (b.hp <= 0) {
    b.hp = 0; b.dead = true; b.deadT = 0;
    for (const e of S.enemies) killEnemy(e);
    for (let i = 0; i < 8; i++) setTimeout(() => { if (S) { burst(rand(1150, 1270), rand(200, 650), ['#fff', '#ffb3cb', '#ffe08a'][i % 3], 30); sfx('boom'); } }, i * 180);
  }
}

// ---------------- 吉祥物 ----------------
function lvMult(d) { return G.upgradeMult[d.lv - 1]; }
function statOf(d, key) {
  const b = D[d.k], up = b.upgrade, m = lvMult(d);
  let v = b[key];
  if (up && up.stat === key) v = v * m;
  return v;
}
function placeDef(k, r, c) {
  const b = D[k];
  const d = { k, r, c, x: colX(c), y: rowBottom(r), hp: b.hp, max: b.hp, lv: 1, t: 0, anim: 0, phase: Math.random() * 6,
    chew: 0, armed: false, armT: b.arm || 0, fuse: b.fuse || 0, frost: false, heal: 0 };
  if (k === 'lala') d.t = b.interval - rand(b.firstDelay[0], b.firstDelay[1]);
  else if (b.rate) d.t = b.rate * 0.6;
  S.grid[r][c] = d; S.defs.push(d);
  burst(d.x, d.y - 10, '#c9a77a', 8); sfx('place');
  return d;
}
function removeDef(d) { if (S.grid[d.r][d.c] === d) S.grid[d.r][d.c] = null; d.gone = true; S.defs = S.defs.filter(x => x !== d); }
function upgradeCost(d) { const u = D[d.k].upgrade; return u && d.lv < 3 ? u.cost[d.lv - 1] : null; }
function doUpgrade(d) {
  const cost = upgradeCost(d);
  if (cost === null || S.bubbles < cost) { sfx('bad'); return false; }
  S.bubbles -= cost; d.lv++;
  const b = D[d.k];
  if (b.upgrade.stat === 'hp') d.max = Math.round(b.hp * lvMult(d));
  d.hp = d.max;
  if (d.k === 'rabbit' && !d.armed) d.armT = Math.min(d.armT, b.arm / lvMult(d));
  floatText(d.x, d.y - 100, 'Lv' + d.lv + '！', '#ffcf4a', 22);
  burst(d.x, d.y - 50, '#ffe27a', 16); sfx('up');
  return true;
}

// 找同一條線前方的甜點
function laneTarget(r, x, range) {
  let best = null;
  for (const e of S.enemies) {
    if (e.dead || e.r !== r || e.x > W - 15 || e.hop > 30) continue;
    if (e.x < x - 25 || e.x > x + range * CW) continue;
    if (!best || e.x < best.x) best = e;
  }
  return best;
}
function bossInRange(x, range) { return S.boss && !S.boss.dead && BOSS_X - x <= range * CW; }

function updateDefs(dt) {
  // 冰淇淋寒氣
  const ices = S.enemies.filter(e => !e.dead && e.k === 'icecream' && e.x < W);
  for (const d of S.defs) {
    d.frost = ices.some(e => Math.hypot((e.x - d.x) / CW, e.r - d.r) <= E.icecream.aura);

          S.skyB.push({ x: d.x + rand(-20, 20), y: d.y - 60, vy: -160, ty: d.y - rand(5, 25), v: amt, life: G.bubbleLife, kind: 'pop', vx: rand(-40, 40), fly: 0 });

          if (!tg) { d.t = b.rate; break; }
          d.t = 0; d.anim = 0.2;
          const atk = statOf(d, 'atk');
          if (d.k === 'bean') {

            S.projs.push({ kind: 'onigiri', r: d.r, sx: d.x + 10, sy: d.y - 70, tx, target: tg, t: 0, T: 0.9, dmg: atk, lob: true, lv: d.lv, rot: 0 });
            sfx('lob');
          } else if (d.k === 'didi') {

            sfx('shoot');
          } else {

      }
      case 'kuku': {

        if (d.t >= b.rate) {

          for (let rr = d.r - 1; rr <= d.r + 1; rr++) if (rr >= 0 && rr < ROWS && laneTarget(rr, d.x, b.range)) any = true;
          if (!any) { d.t = b.rate; break; }
          d.t = 0; d.anim = 0.2;
          for (let rr = d.r - 1; rr <= d.r + 1; rr++) if (rr >= 0 && rr < ROWS)
            S.projs.push({ kind: 'snow', r: rr, x: d.x + 30, y: d.y - 55, ty: rowBottom(rr) - 55, dmg: statOf(d, 'atk'), lv: d.lv });

        }
        break;
      }
      case 'devil': {
        d.t += dt / fm;

          const inR = S.enemies.filter(e => !e.dead && e.r === d.r && e.x < W - 15 && e.x > d.x - 30 && e.x < d.x + b.range * CW && e.hop < 30);
          const boss = bossInRange(d.x, b.range);
          if (!inR.length && !boss) { d.t = b.rate; break; }
          d.t = 0; d.anim = 0.35;
          const atk = statOf(d, 'atk');

      case 'gf': {

            o.hp = Math.min(o.max, o.hp + amt); healed = true;

        let tg = null;
        for (const e of S.enemies) if (!e.dead && e.r === d.r && e.hop < 30 && e.x - d.x > -20 && e.x - d.x < b.range * CW && (!tg || e.x < tg.x)) tg = e;

}
function triggerMine(d) {
  const b = D.rabbit;
  for (const e of S.enemies) if (!e.dead && e.r === d.r && Math.abs(e.x - d.x) < CW * 0.75) hurt(e, b.atk, { quiet: true });
  explosion(d.x, d.y - 30, 1.0, '#ffb347');

}

// ---------------- 甜點更新 ----------------
function blockerFor(e) {
  let best = null;
  for (const d of S.defs) {
    if (d.r !== e.r || d.gone) continue;
    if (d.k === 'kwuji') continue;
    const gap = e.x - d.x;
    if (gap > 0 && gap < 62 && (!best || d.x > best.x)) best = d;
  }
  return best;
}
function updateEnemies(dt) {
  for (const e of S.enemies) {
    if (e.dead) { e.deadT -= dt; continue; }
    e.flash -= dt; e.phase += dt;
    if (e.slowT > 0) e.slowT -= dt;
    const sf = e.slowT > 0 ? 1 - D.mei.slow : 1;
    if (e.state === 'jump') {
      e.jt += dt; const p = Math.min(1, e.jt / 0.9);
      e.x = lerp(e.jx0, e.jx1, p); e.hop = Math.sin(Math.PI * p) * 110;
      if (p >= 1) { e.state = 'walk'; e.hop = 0; e.jumped = true; e.speed = E.lollipop.speedAfter; }
      continue;
    }
    if (e.state === 'fuse') {
      e.ft -= dt;
      if (e.ft <= 0) {
        const c = Math.round((e.x - 40 - BX - CW / 2) / CW);
        for (const d of [...S.defs]) if (Math.abs(d.r - e.r) <= 1 && Math.abs(d.x - (e.x - 45)) <= CW * 1.5) { d.hp -= E.popcorn.blast; if (d.hp <= 0) removeDef(d); }
        explosion(e.x - 20, rowBottom(e.r) - 40, 1.3, '#ffd34d');
        e.dead = true; e.deadT = 0.01;
      }
      continue;
    }
    const bl = blockerFor(e);
    if (bl) {
      if (e.k === 'lollipop' && !e.jumped) {
        if (bl.k === 'laoda') { e.jumped = true; e.speed = E.lollipop.speedAfter; floatText(e.x, rowBottom(e.r) - 110, '咚！', '#fff', 20); sfx('armor'); }
        else { e.state = 'jump'; e.jt = 0; e.jx0 = e.x; e.jx1 = bl.x - 70; e.eating = false; }
        continue;
      }
      if (e.k === 'donut' && e.rolling) {
        e.rolling = false; e.speed = E.donut.speedAfter; bl.hp -= E.donut.impact; e.dizzy = 2.5;
        burst(bl.x + 20, bl.y - 40, '#f6a6c8', 8); sfx('hit');
        if (bl.hp <= 0) removeDef(bl);
        continue;
      }
      if (e.k === 'popcorn') { e.state = 'fuse'; e.ft = E.popcorn.fuse; e.eating = false; continue; }
      if (bl.k === 'rabbit' && bl.armed) { triggerMine(bl); continue; }
      e.eating = true;
      bl.hp -= E[e.k].bite * sf * dt; bl.hurtT = 0.1;
      if (Math.random() < dt * 2.5) sfx('chomp');
      if (bl.hp <= 0) removeDef(bl);
    } else {
      e.eating = false;
      let sp = e.speed * sf; if (e.dizzy > 0) { e.dizzy -= dt; }
      e.x -= sp * dt;
      if (e.rolling) e.ang -= sp * dt / 30;
    }
    // 吸塵器
    const m = S.mowers[e.r];
    if (e.x < BX - 8 && m.st === 'idle') { m.st = 'run'; sfx('mower'); }
    if (e.x < BX - 75 && m.st === 'gone') lose();
  }
  S.enemies = S.enemies.filter(e => !(e.dead && e.deadT <= 0));
}
function updateMowers(dt) {
  for (const m of S.mowers) {
    if (m.st !== 'run') continue;
    m.x += G.mowerSpeed * dt;
    for (const e of S.enemies) if (!e.dead && e.r === m.r && Math.abs(e.x - m.x) < 55 && e.x < W) killEnemy(e);
    if (m.x > W + 60) m.st = 'gone';
  }
}

// ---------------- 子彈 ----------------
function updateProjs(dt) {
  for (const p of S.projs) {
    if (p.delay > 0) { p.delay -= dt; continue; }
    if (p.lob) {
      p.t += dt; const k = Math.min(1, p.t / p.T); p.rot += dt * 8;
      if (p.target !== 'boss' && p.target && !p.target.dead) p.tx = p.target.x;
      p.x = lerp(p.sx, p.tx, k); p.y = lerp(p.sy, rowBottom(p.r) - 50, k) - Math.sin(Math.PI * k) * 150;
      if (k >= 1) {
        p.done = true;
        if (p.target === 'boss') hurtBoss(p.dmg);
        else {
          let tg = p.target && !p.target.dead && Math.abs(p.target.x - p.x) < 50 ? p.target : null;
          if (!tg) for (const e of S.enemies) if (!e.dead && e.r === p.r && Math.abs(e.x - p.x) < 45 && e.hop < 30) { tg = e; break; }
          if (tg) hurt(tg, p.dmg, { lob: true });
        }
        burst(p.x, p.y, '#ffffff', 6);
      }
      continue;
    }
    p.x += G.projectileSpeed * dt;
    if (p.ty !== undefined) p.y += (p.ty - p.y) * Math.min(1, dt * 10);
    if (S.boss && !S.boss.dead && p.x >= BOSS_X) { hurtBoss(p.dmg); p.done = true; burst(p.x, p.y, '#fff', 4); continue; }
    let tg = null;
    for (const e of S.enemies) if (!e.dead && e.r === p.r && e.hop < 30 && e.x < W - 10 && Math.abs(e.x - p.x) < 24 && (!tg || e.x < tg.x)) tg = e;
    if (tg) {
      hurt(tg, p.dmg);
      if (p.slow) tg.slowT = D.mei.slowTime;
      burst(p.x, p.y, p.kind === 'ice' ? '#9fe6ff' : '#ffffff', 5);
      p.done = true;
    }
    if (p.x > W + 30) p.done = true;
  }
  S.projs = S.projs.filter(p => !p.done);
}

// ---------------- Boss ----------------
function updateBoss(dt) {
  const b = S.boss; if (!b) return;
  b.flash -= dt; b.anim += dt;
  if (b.dead) { b.deadT += dt; if (b.deadT > 2.2) win(); return; }
  const cfg = E.boss, enr = b.hp / b.max < cfg.enrageAt;
  if (enr && !b.enraged) { b.enraged = true; banner('婚禮蛋糕暴怒了！', '#ff5a5a'); sfx('alarm'); }
  const sp = enr ? 1.6 : 1;
  b.throwT -= dt * sp; b.sumT -= dt * sp;
  if (b.throwT <= 0) {
    b.throwT = cfg.throwEvery;
    let r, c;
    if (S.defs.length) { const d = S.defs[Math.floor(Math.random() * S.defs.length)]; r = d.r; c = d.c; }
    else { r = Math.floor(Math.random() * ROWS); c = Math.floor(Math.random() * COLS); }
    S.hazards.push({ r, c, t: 1.6, max: 1.6 });
  }
  if (b.sumT <= 0) {
    b.sumT = cfg.summonEvery;
    const n = cfg.summonCount + (enr ? 1 : 0);
    for (let i = 0; i < n; i++) spawnEnemy(S.L.pool[Math.floor(Math.random() * S.L.pool.length)], Math.floor(Math.random() * ROWS), BOSS_X - 20);
    b.roar = 0.6;
  }
  if (b.roar > 0) b.roar -= dt;
  for (const h of S.hazards) {
    h.t -= dt;
    if (h.t <= 0) {
      h.done = true;
      const d = S.grid[h.r][h.c];
      if (d) { d.hp -= cfg.throwDmg; if (d.hp <= 0) removeDef(d); }
      burst(colX(h.c), rowY(h.r) + 20, '#fffaf0', 18); S.shake = 0.25; sfx('splat');
      S.parts.push({ x: colX(h.c), y: rowY(h.r) + 30, vx: 0, vy: 0, life: 3, max: 3, c: '#fffaf0', s: 0, splat: true });
    }
  }
  S.hazards = S.hazards.filter(h => !h.done);
}

// ---------------- 泡泡 ----------------
function updateBubbles(dt) {
  if (!S.sc.night || S.L.boss || save.alwaysSky) {
    S.skyT -= dt;
    if (S.skyT <= 0) {
      S.skyT = rand(G.skyBubbleInterval[0], G.skyBubbleInterval[1]);
      S.skyB.push({ x: rand(BX + 40, BR - 60), y: 100, vy: 55, ty: rand(BY + 50, BY + ROWS * CH - 40), v: G.skyBubbleValue, life: G.bubbleLife, kind: 'sky', vx: 0, fly: 0 });
    }
  }
  for (const b of S.skyB) {
    if (b.fly > 0) {
      b.fly += dt * 2.2; const k = Math.min(1, b.fly);
      b.x = lerp(b.fx, 58, k); b.y = lerp(b.fy, 55, k);
      if (k >= 1) { b.done = true; S.bubbles += b.v; }
      continue;
    }
    if (b.kind === 'pop') {
      b.vy += 500 * dt; b.y += b.vy * dt; b.x += b.vx * dt;
      if (b.y >= b.ty && b.vy > 0) { b.y = b.ty; b.vy = 0; b.vx = 0; b.kind = 'rest'; }
    } else if (b.kind === 'sky') {
      b.y += b.vy * dt; if (b.y >= b.ty) { b.y = b.ty; b.kind = 'rest'; }
    } else { b.life -= dt; if (save.autoCollect && G.bubbleLife - b.life > 0.3) { collect(b); continue; } if (b.life <= 0) b.done = true; }
  }
  S.skyB = S.skyB.filter(b => !b.done);
}
function collect(b) { S.collected++; b.fly = 0.0001; b.fx = b.x; b.fy = b.y; sfx('pop'); }

// ---------------- 特效 ----------------
function burst(x, y, c, n) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = rand(60, 220); S.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: rand(0.3, 0.7), max: 0.7, c, s: rand(3, 7), g: true }); } }
function explosion(x, y, size, c) {
  burst(x, y, c, 26); burst(x, y, '#fff3a0', 14);
  S.parts.push({ x, y, vx: 0, vy: 0, life: 0.45, max: 0.45, c, s: 0, ring: size * 120 });
  S.shake = 0.3; sfx('boom');
}
function floatText(x, y, t, c = '#fff', s = 18) { S.texts.push({ x, y, t, c, s, life: 1.2 }); }
function updateFx(dt) {
  for (const p of S.parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.g) p.vy += 400 * dt; }
  S.parts = S.parts.filter(p => p.life > 0);
  for (const t of S.texts) { t.life -= dt; t.y -= 30 * dt; }
  S.texts = S.texts.filter(t => t.life > 0);
  for (const f of S.flames) f.t -= dt;
  S.flames = S.flames.filter(f => f.t > 0);
  if (S.shake > 0) S.shake -= dt;
  if (S.banner) { S.banner.t -= dt; if (S.banner.t <= 0) S.banner = null; }
}

// ---------------- 主更新 ----------------
function update(dt) {
  S.time += dt;
  if (S.intro > 0) S.intro -= dt;
  if (S.tut) tutUpdate(dt);
  for (const c of S.cards) if (c.cd > 0) c.cd -= dt;
  updateBubbles(dt);
  // 波次
  if (!S.L.boss && S.wave < S.totalWaves) {
    if (!S.tut) S.waveT -= dt;
    const alive = S.enemies.some(e => !e.dead) || S.spawnQ.length;
    if (!alive && S.wave > 0 && S.waveT > 4) S.waveT = 4;
    if (S.waveT <= 0) {
      makeWave(S.wave); S.wave++;
      S.waveT = G.waveInterval;
      if (S.L.endless) save.endlessBest = Math.max(save.endlessBest, S.wave - 1), persist();
    }
  }
  for (const q of S.spawnQ) { q.t -= dt; if (q.t <= 0) { spawnEnemy(q.k, q.r); q.done = true; } }
  S.spawnQ = S.spawnQ.filter(q => !q.done);
  updateDefs(dt); updateEnemies(dt); updateProjs(dt); updateMowers(dt); updateBoss(dt); updateFx(dt);
  if (S.over) return;
  if (lastWave() && !S.spawnQ.length && !S.enemies.some(e => !e.dead)) { S.endT += dt; if (S.endT > 1.2) win(); }
}

function win() {
  if (S.over) return; S.over = true;
  const L = S.L; let unlockNew = null;
  if (!save.cleared.includes(L.id)) { save.cleared.push(L.id); if (L.unlock && !C.startUnlocked.includes(L.unlock)) unlockNew = L.unlock; }
  persist();
  playBgm('result', false); sfx('win');
  setTimeout(() => {
    $('res-title').className = 'res-title'; $('res-title').textContent = L.boss ? '打倒超級婚禮蛋糕！' : '守住了！過關！';
    let body = L.boss ? '甜點大軍全部投降，家裡又恢復和平了 🎉' : '';
    if (unlockNew) body = `<div class="newfriend"><img src="${IMG[unlockNew].src}"><div style="color:#4a2c1a;text-shadow:none;text-align:left"><div style="font-size:16px">新夥伴加入！</div><div style="font-size:30px;font-weight:900">${D[unlockNew].name}</div><div style="font-size:18px">${D[unlockNew].role}：${D[unlockNew].desc}</div></div></div>`;
    if (L.id === '3-5' && !save.test) body += '<div>無盡模式解鎖了！</div>';
    $('res-body').innerHTML = body;
    const btns = $('res-btns'); btns.innerHTML = '';

}

    $('res-title').className = 'res-title lose';
    $('res-title').textContent = '甜點大軍吃掉了你的家！';
    $('res-body').innerHTML = S.L.endless ? `撐過了 ${Math.max(0, S.wave - 1)} 波（最佳紀錄 ${save.endlessBest} 波）` : '換個排法再試一次吧！';
    const btns = $('res-btns'); btns.innerHTML = '';

    $('o-result').classList.add('on');
  }, 900);
}
function mkBtn(t, cls, fn) { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = t; b.onclick = () => { sfx('click'); fn(); }; return b; }

const HUD = { card0: 124, cardW: 80, cardGap: 6, cardY: 10, cardH: 94 };
const BTN = { up: { x: 830, y: 12, w: 72, h: 90 }, shovel: { x: 908, y: 12, w: 72, h: 90 }, speed: { x: 1150, y: 14, w: 56, h: 46 }, pause: { x: 1212, y: 14, w: 56, h: 46 } };
const inRect = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

    lines.push([`${lab}：${statAt(d.k, key, d.lv)}${u}`, '#fff', 15]);
    lines.push([b.upgrade ? '已經升到最高級了' : '這位夥伴不能升級', '#ccc', 14]);
  }
  if (b.rate && b.atk) lines.push([`攻擊頻率 ${b.rate} 秒　射程 ${b.range} 格`, '#e8d8c8', 13]);
  return lines;
}
function drawPanel(lines, ax, ay) {
  let tw = 0; for (const [tx, , sz] of lines) { ctx.font = `900 ${sz}px sans-serif`; tw = Math.max(tw, ctx.measureText(tx).width); }
  tw += 24; const th = lines.reduce((a, l) => a + l[2] + 9, 12);
  const bx = clamp(ax - tw / 2, 4, W - tw - 4), by = clamp(ay - th, 118, H - th - 4);
  ctx.fillStyle = 'rgba(74,44,26,.92)'; rr(ctx, bx, by, tw, th, 10); ctx.fill();
  let yy = by + 8; for (const [tx, c, sz] of lines) { yy += (sz + 9) / 2; txt(ctx, tx, bx + tw / 2, yy, sz, c, null); yy += (sz + 9) / 2; }
}
const CF = { box: { x: 410, y: 270, w: 460, h: 190 }, ok: { x: 460, y: 390, w: 160, h: 50 }, no: { x: 660, y: 390, w: 160, h: 50 } };
function drawConfirm() {
  const d = S.confirm.d; if (d.gone) { S.confirm = null; return; }
  const b = D[d.k], key = mainStat(d.k), u = STAT_UNIT[key], cost = upgradeCost(d), ok = cost !== null && S.bubbles >= cost;
  ctx.fillStyle = 'rgba(40,20,10,.35)'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#ffe07a'; ctx.lineWidth = 4; rr(ctx, BX + d.c * CW + 3, BY + d.r * CH + 3, CW - 6, CH - 6, 12); ctx.stroke();
  const B = CF.box; ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 18; ctx.fillStyle = '#fff6e6'; rr(ctx, B.x, B.y, B.w, B.h, 22); ctx.fill(); ctx.restore();
  ctx.strokeStyle = '#ffcf4a'; ctx.lineWidth = 4; rr(ctx, B.x, B.y, B.w, B.h, 22); ctx.stroke();
  const img = IMG[d.k]; if (imgOk(img)) { const h = 90, w = h * img.naturalWidth / img.naturalHeight; ctx.drawImage(img, B.x + 20, B.y + 18, w, h); }
  txt(ctx, `要把${b.name}升到 Lv${d.lv + 1} 嗎？`, B.x + 125, B.y + 34, 21, '#4a2c1a', null, 'left');
  txt(ctx, `${STAT_LABEL[key]}：${statAt(d.k, key, d.lv)}${u} → ${statAt(d.k, key, d.lv + 1)}${u}`, B.x + 125, B.y + 68, 17, '#4a2c1a', null, 'left');
  txt(ctx, ok ? `花費 ${cost} 泡泡` : `需要 ${cost} 泡泡（還不夠喔）`, B.x + 125, B.y + 96, 16, ok ? '#2a8a69' : '#d84a4a', null, 'left');
  for (const [R, lab, col, sh] of [[CF.ok, '升級！', ok ? '#ff8fb1' : '#c8b8b0', ok ? '#c0507a' : '#8a7a70'], [CF.no, '取消', '#8fe0c4', '#2a8a69']]) {
    ctx.fillStyle = col; rr(ctx, R.x, R.y, R.w, R.h, 16); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
    txt(ctx, lab, R.x + R.w / 2, R.y + R.h / 2 + 1, 20, '#fff', sh);
  }
}
function drawCursor(t) {
  const x = S.mx, y = S.my; if (x < 0) return;
  const cell = cellAt(x, y);
  if (S.sel !== null) {
    const k = S.cards[S.sel].k, img = IMG[k];
    if (cell) {
      const [r, c] = cell, free = !S.grid[r][c];
      ctx.fillStyle = free ? 'rgba(255,255,255,.25)' : 'rgba(255,60,60,.25)'; ctx.fillRect(BX + c * CW, BY + r * CH, CW, CH);
      if (free && imgOk(img)) { ctx.globalAlpha = 0.45; const h = 88, w = h * img.naturalWidth / img.naturalHeight; ctx.drawImage(img, colX(c) - w / 2, rowBottom(r) - h, w, h); ctx.globalAlpha = 1; }
    }
    if (imgOk(img)) { const h = 64, w = h * img.naturalWidth / img.naturalHeight; ctx.globalAlpha = 0.85; ctx.drawImage(img, x - w / 2, y - h / 2, w, h); ctx.globalAlpha = 1; }
  } else if (S.tool === 'shovel') {
    if (cell && S.grid[cell[0]][cell[1]]) { ctx.fillStyle = 'rgba(255,60,60,.25)'; ctx.fillRect(BX + cell[1] * CW, BY + cell[0] * CH, CW, CH); }
    ctx.save(); ctx.translate(x + 10, y - 10); ctx.rotate(0.6); ctx.fillStyle = '#8a5530'; ctx.fillRect(-3, -28, 6, 28); ctx.fillStyle = '#aab4c4'; ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(12, 0); ctx.lineTo(9, 18); ctx.lineTo(0, 24); ctx.lineTo(-9, 18); ctx.closePath(); ctx.fill(); ctx.restore();
  } else if (S.tool === 'up') {
    if (cell) {
      const d = S.grid[cell[0]][cell[1]];
      if (d) {
        const cost = upgradeCost(d), ok = cost !== null && S.bubbles >= cost;
        ctx.fillStyle = cost === null ? 'rgba(150,150,150,.25)' : ok ? 'rgba(255,220,80,.3)' : 'rgba(255,60,60,.22)'; ctx.fillRect(BX + cell[1] * CW, BY + cell[0] * CH, CW, CH);

    }
    ctx.save(); ctx.translate(x + 14, y - 12); ctx.fillStyle = '#ffcf4a'; ctx.strokeStyle = '#b8841a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(12, 0); ctx.lineTo(5, 0); ctx.lineTo(5, 12); ctx.lineTo(-5, 12); ctx.lineTo(-5, 0); ctx.lineTo(-12, 0); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  }
}
function render(t) {
  const si = S.L.scene;
  if (!BG[si]) BG[si] = makeBg(si);
  ctx.save();
  if (S.shake > 0) ctx.translate(rand(-5, 5), rand(-4, 4));
  ctx.drawImage(BG[si], 0, 0);
  // 奶油痕跡、危險預告
  for (const p of S.parts) if (p.splat) { ctx.save(); ctx.globalAlpha = Math.min(1, p.life) * 0.8; ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(p.x, p.y, 40, 14, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
  for (const h of S.hazards) {
    const k = 1 - h.t / h.max, x = colX(h.c), y = rowY(h.r);
    ctx.fillStyle = `rgba(255,60,60,${0.15 + k * 0.25})`; ctx.beginPath(); ctx.ellipse(x, y + 30, 46 * (0.5 + k * 0.5), 16 * (0.5 + k * 0.5), 0, 0, Math.PI * 2); ctx.fill();
  }
  for (const m of S.mowers) drawMower(m);
  if (S.boss) {
    const b = S.boss;
    ctx.save();
    if (b.dead) { ctx.globalAlpha = Math.max(0, 1 - b.deadT / 2); }
    ctx.translate(1222, 712 + (b.dead ? b.deadT * 120 : Math.sin(b.anim * 2) * 4)); ctx.scale(0.78, 0.92);
    drawBossShape(ctx, 0, 0, b.anim, b.hp / b.max, b.enraged, Math.max(0, b.roar || 0));
    if (b.flash > 0) { ctx.globalAlpha = 0.25; ctx.fillStyle = '#fff'; ctx.fillRect(-150, -460, 300, 460); }
    ctx.restore();
  }
  for (let r = 0; r < ROWS; r++) {
    for (const d of S.defs) if (d.r === r) drawDef(d, t);
    const es = S.enemies.filter(e => e.r === r).sort((a, b) => b.x - a.x);
    for (const e of es) drawEnemy(e, t);
    for (const f of S.flames) if (f.r === r) drawFlame(f, t);
  }
  for (const p of S.projs) drawProj(p, t);
  // 奶油砲彈飛行
  for (const h of S.hazards) {
    const k = 1 - h.t / h.max, sx = 1150, sy = 300, tx = colX(h.c), ty = rowY(h.r) + 20;
    const x = lerp(sx, tx, k), y = lerp(sy, ty, k) - Math.sin(Math.PI * k) * 220;
    ctx.fillStyle = '#fffaf0'; ctx.strokeStyle = '#e6d6bd'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e8364f'; ctx.beginPath(); ctx.arc(x + 4, y - 14, 5, 0, Math.PI * 2); ctx.fill();
  }
  for (const p of S.parts) {
    if (p.splat) continue;
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    if (p.ring) { ctx.strokeStyle = p.c; ctx.lineWidth = 10 * a; ctx.beginPath(); ctx.arc(p.x, p.y, p.ring * (1 - a) + 10, 0, Math.PI * 2); ctx.stroke(); }
    else if (p.heart) txt(ctx, '♥', p.x, p.y, p.s, p.c, '#fff', 'center', 3);
    else { ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  drawHUD(t);
  for (const b of S.skyB) {
    const a = b.kind === 'rest' && b.life < 3 ? (Math.sin(t * 12) > 0 ? 0.4 : 1) : 1;
    drawBubble(b.x, b.y + Math.sin(t * 3 + b.x) * 3, b.v > 25 ? 34 : 30, b.v, a);
  }
  for (const tx of S.texts) { ctx.globalAlpha = Math.min(1, tx.life * 2); txt(ctx, tx.t, tx.x, tx.y, tx.s, tx.c, '#4a2c1a'); ctx.globalAlpha = 1; }
  if (S.info && !S.info.gone && !S.confirm) { const d = S.info; ctx.strokeStyle = '#ffe07a'; ctx.lineWidth = 3; rr(ctx, BX + d.c * CW + 3, BY + d.r * CH + 3, CW - 6, CH - 6, 12); ctx.stroke(); drawPanel(defInfoLines(d), d.x, d.y - 100); }

// ======================================================================
//  教學（第一關）
// ======================================================================
const TUT_PANEL = { x: 330, y: 588, w: 640, h: 118 };
const TUT_SKIP = { x: 862, y: 556, w: 108, h: 32 };
const TUT_BTN = { x: 850, y: 650, w: 108, h: 44 };
const hasDef = k => S.defs.some(d => d.k === k);
const cardIdx = k => S.cards.findIndex(c => c.k === k);
const TUT = [
  { text: '嗨～我是略略！甜點大軍要來吃掉我們的家了，快跟我一起佈陣吧！', btn: '好！' },
  { text: '先點我的卡片，選擇「大長今略略」～', target: () => cardIdx('lala') >= 0 && cardRect(cardIdx('lala')), done: () => hasDef('lala') || (S.sel !== null && S.cards[S.sel].k === 'lala') },
  { text: '點左邊的格子把我放下去！我會一直吹泡泡給大家用喔♪', target: () => ({ x: BX, y: BY, w: CW, h: CH * ROWS }), done: () => hasDef('lala') },
  { text: '接著選「烏雞」，放在略略的右邊！烏雞會射紙飛機打甜點～', target: () => hasDef('wuji') || (S.sel !== null && S.cards[S.sel].k === 'wuji') ? { x: BX + CW, y: BY, w: CW * 3, h: CH * ROWS } : cardIdx('wuji') >= 0 && cardRect(cardIdx('wuji')), done: () => hasDef('wuji') },
  { text: '看到泡泡了嗎？天上和略略都會冒出泡泡，點一下就能收下來！', enter: () => { S.skyT = Math.min(S.skyT, 1); }, done: () => S.collected > 0 },
  { text: '左上角是你的泡泡數。泡泡夠多時，按「升級」再點夥伴，就能讓他變強喔！最高 Lv3～', target: () => BTN.up, btn: '知道了' },
  { text: '甜點會從右邊的每一條線走過來，每條線都要有人守！真的守不住時，左邊的吸塵器會幫忙一次。', target: () => ({ x: BX - 70, y: BY, w: 60, h: CH * ROWS }), btn: '下一步' },
  { text: '準備好了嗎？甜點大軍要來囉，加油！', btn: '開始！' },
];
function tutEnd() { S.tut = null; save.tutorialDone = true; persist(); S.waveT = Math.min(S.waveT, 20); }
function tutNext() {
  S.tut.step++; S.tut.t = 0;
  if (S.tut.step >= TUT.length) { tutEnd(); return; }
  const st = TUT[S.tut.step]; if (st.enter) st.enter();
  sfx('click');
}
function tutUpdate(dt) {
  S.tut.t += dt;
  const st = TUT[S.tut.step];
  while (S.tut && !TUT[S.tut.step].btn && TUT[S.tut.step].done && TUT[S.tut.step].done()) { tutNext(); }
}
function tutClick(x, y) {
  if (inRect(x, y, TUT_SKIP)) { tutEnd(); sfx('click'); return true; }
  const st = TUT[S.tut.step];
  if (st.btn && inRect(x, y, TUT_BTN)) { tutNext(); return true; }

}
function wrapLines(text, maxW, size) {
  ctx.font = `900 ${size}px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif`;
  const lines = []; let cur = '';

function drawTut(t) {

  const tg = st.target && st.target();
  if (tg) {
    const pad = 6 + Math.sin(t * 6) * 3;
    ctx.save(); ctx.strokeStyle = '#ffe14d'; ctx.lineWidth = 5; ctx.shadowColor = '#ffb000'; ctx.shadowBlur = 14;

  ctx.fillStyle = '#fff6e6'; rr(ctx, P.x, P.y, P.w, P.h, 22); ctx.fill(); ctx.restore();
  ctx.strokeStyle = '#ff8fb1'; ctx.lineWidth = 4; rr(ctx, P.x, P.y, P.w, P.h, 22); ctx.stroke();
  const img = IMG.lala;
  if (imgOk(img)) { const h = 120, w = h * img.naturalWidth / img.naturalHeight; ctx.drawImage(img, P.x - 20, P.y - 30 + Math.sin(t * 4) * 3, w, h); }
  const lines = wrapLines(st.text, st.btn ? 380 : 500, 20);
  lines.forEach((ln, i) => txt(ctx, ln, P.x + 112, P.y + 30 + i * 28 - (lines.length > 3 ? 8 : 0), 20, '#4a2c1a', null, 'left'));
  txt(ctx, `${S.tut.step + 1}／${TUT.length}`, P.x + 112, P.y + P.h - 14, 13, '#c08a6a', null, 'left');
  if (st.btn) {
    const B = TUT_BTN; ctx.fillStyle = '#ff8fb1'; rr(ctx, B.x, B.y, B.w, B.h, 16); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
    txt(ctx, st.btn, B.x + B.w / 2, B.y + B.h / 2 + 1, 19, '#fff', '#c0507a');
  }

  txt(ctx, '跳過教學 ▶', K.x + K.w / 2, K.y + K.h / 2 + 1, 14, '#fff', null);
}

// ======================================================================
//  主迴圈
// ======================================================================
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (screen === 'game' && S) {
    if (!S.paused && !S.over) for (let i = 0; i < S.speed; i++) update(dt);
    else if (S.over) updateFx(dt);
    render(now / 1000);
  } else {
    ctx.clearRect(0, 0, W, H);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
show('title');
