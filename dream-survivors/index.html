<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>夢幻倖存者</title>
<style>
/* Layout: one fixed 480x700 stage, scaled to fit; canvas draws background + world, DOM draws menus.
   Single-theme by choice: the game ships its own three scene themes. */
:root{
  --pink:#ff5fae; --purple:#7b5cd6; --ink:#3b2a78; --ink2:#4a2f9c;
  --gold:#ffd54a; --gold2:#ffb300; --sky:#6cc3ff;
  --card:rgba(255,255,255,.86);
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;padding:0;background:#2a1f55;color:var(--ink);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:var(--font)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#2a1f55}
#stage{width:480px;height:700px;position:relative;flex:none;overflow:hidden;transform-origin:center center;
  border-radius:0;background:#c7b8ff}
#c,#confetti{position:absolute;left:0;top:0;width:480px;height:700px;display:block}
#confetti{pointer-events:none;z-index:60}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20}
.screen[hidden]{display:none!important}
.title{font-weight:900;font-size:46px;line-height:1.1;color:var(--purple);margin:0;text-align:center;
  -webkit-text-stroke:9px #fff;paint-order:stroke fill;text-shadow:0 5px 0 #ffb3dc,0 0 26px rgba(255,95,174,.65)}
.h2{font-weight:900;font-size:34px;color:var(--purple);margin:0;text-align:center;
  -webkit-text-stroke:7px #fff;paint-order:stroke fill;text-shadow:0 4px 0 #ffb3dc,0 0 20px rgba(255,95,174,.55)}
.sub{font-weight:800;color:var(--ink2);font-size:16px;text-align:center;
  background:rgba(255,255,255,.7);border-radius:999px;padding:4px 16px}
.card{background:var(--card);border:4px solid var(--pink);border-radius:22px;
  box-shadow:0 0 24px rgba(255,95,174,.55);padding:16px;box-sizing:border-box}
.btn{border:3px solid var(--pink);border-radius:999px;background:linear-gradient(#fff,#ffe4f4);color:var(--ink2);
  font:800 22px var(--font);padding:11px 30px;min-width:230px;cursor:pointer;
  box-shadow:0 4px 0 #f08cc4,0 0 18px rgba(255,95,174,.5)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #f08cc4,0 0 12px rgba(255,95,174,.5)}
.btn.small{min-width:130px;font-size:18px;padding:8px 22px}
.btn.gold{background:linear-gradient(#fff3b0,#ffd54a);border-color:var(--gold2);box-shadow:0 4px 0 #e0a000,0 0 18px rgba(255,179,0,.55)}
.blink{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.bounce{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
#menuChar{height:190px;filter:drop-shadow(0 8px 12px rgba(59,42,120,.35))}
#menuBtns{display:flex;flex-direction:column;gap:12px;align-items:center}
/* character grid */
#charGrid{display:grid;grid-template-columns:repeat(3,128px);gap:12px}
.cc{width:128px;height:168px;border:4px solid transparent;border-radius:18px;background:rgba(255,255,255,.7);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding:8px 4px;box-sizing:border-box;cursor:pointer;font:800 13px var(--font);color:var(--ink2)}
.cc img{height:110px;max-width:110px;object-fit:contain}
.cc.sel{border-color:var(--pink);box-shadow:0 0 18px rgba(255,95,174,.8);background:#fff}
/* background picker */
#bgGrid{display:flex;gap:12px}
.bc{width:136px;border:4px solid transparent;border-radius:18px;background:rgba(255,255,255,.75);padding:8px;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font:800 16px var(--font);color:var(--ink2)}
.bc canvas{width:112px;height:163px;border-radius:12px}
.bc.sel{border-color:var(--pink);box-shadow:0 0 18px rgba(255,95,174,.8);background:#fff}
/* settings */
#setList{display:flex;flex-direction:column;gap:12px;width:380px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:800;font-size:18px;color:var(--ink2)}
.row small{display:block;font-weight:600;font-size:12px;color:#6b58b0;margin-top:2px}
.sw{flex:none;width:62px;height:34px;border-radius:999px;border:3px solid var(--pink);background:#e9dcff;position:relative;cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:left .15s}
.sw.on{background:var(--pink)}
.sw.on::after{left:31px}
/* game overlay bits */
#pauseBtn{position:absolute;right:12px;top:30px;width:44px;height:44px;border-radius:50%;z-index:30;cursor:pointer;
  border:3px solid var(--pink);background:rgba(255,255,255,.88);box-shadow:0 0 14px rgba(255,95,174,.6);
  display:flex;align-items:center;justify-content:center;gap:5px;padding:0}
#pauseBtn i{display:block;width:6px;height:18px;border-radius:3px;background:var(--ink2)}
#pauseBtn[hidden]{display:none}
#pauseMenu,#levelup,#countdown{background:rgba(59,42,120,.38);z-index:40}
#countdown{z-index:45;pointer-events:none}
#countdown b{font-size:130px;font-weight:900;color:#fff;-webkit-text-stroke:12px var(--pink);paint-order:stroke fill;text-shadow:0 0 30px rgba(255,255,255,.8)}
#lvOpts{display:flex;flex-direction:column;gap:12px;width:400px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;width:100%;font-family:var(--font);
  border:4px solid var(--pink);border-radius:20px;background:#fff;padding:12px 16px;box-shadow:0 0 18px rgba(255,95,174,.5);color:var(--ink2)}
.opt:active{transform:scale(.98)}
.opt .ic{flex:none;width:52px;height:52px;border-radius:50%;background:linear-gradient(#fff3b0,#ffd54a);border:3px solid var(--gold2);
  display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--ink)}
.opt b{display:block;font-size:19px;font-weight:900}
.opt span.d{display:block;font-size:14px;font-weight:600;color:#6b58b0;margin-top:2px}
.opt .tag{display:inline-block;background:var(--pink);color:#fff;border-radius:999px;padding:1px 9px;font-size:12px;margin-left:6px;vertical-align:2px}
/* result */
#resBox{width:400px;min-height:430px;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.rrow{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:22px;color:var(--ink2);
  animation:pop .45s cubic-bezier(.2,1.6,.4,1) both;border-bottom:2px dashed #ffc2e3;padding-bottom:6px}
.rrow b{font-size:28px;color:var(--purple);font-variant-numeric:tabular-nums}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.rtitle{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.congrats{text-align:center;font-weight:900;font-size:24px;color:var(--ink2);animation:pop .5s both}
.bigscore{text-align:center;font-weight:900;font-size:64px;color:var(--gold2);-webkit-text-stroke:8px #fff;paint-order:stroke fill;
  text-shadow:0 4px 0 #ffb3dc,0 0 24px rgba(255,179,0,.8);font-variant-numeric:tabular-nums;animation:pop .5s both}
#resBtns{display:flex;gap:12px;justify-content:center;margin-top:6px;animation:pop .4s both}
</style>

<div id="wrap">
<div id="stage">
  <canvas id="c"></canvas>

  <div id="splash" class="screen">
    <h1 class="title">夢幻倖存者</h1>
    <div class="sub">毛絨夥伴們的甜點大作戰</div>
    <div class="h2 blink" style="font-size:26px;margin-top:40px">輕觸畫面開始</div>
  </div>

  <div id="menu" class="screen" hidden>
    <h1 class="title">夢幻倖存者</h1>
    <img id="menuChar" class="bounce" alt="">
    <div id="menuBtns">
      <button class="btn gold" id="btnStart">開始遊戲</button>
      <button class="btn" id="btnChars">更換角色</button>
      <button class="btn" id="btnBgs">選擇背景</button>
      <button class="btn" id="btnSettings">設定</button>
    </div>
  </div>

  <div id="chars" class="screen" hidden>
    <h2 class="h2">更換角色</h2>
    <div id="charGrid"></div>
    <button class="btn small" data-back="1" id="charsBack">返回</button>
  </div>

  <div id="bgs" class="screen" hidden>
    <h2 class="h2">選擇背景</h2>
    <div id="bgGrid"></div>
    <button class="btn small" data-back="1" id="bgsBack">返回</button>
  </div>

  <div id="settings" class="screen" hidden>
    <h2 class="h2">設定</h2>
    <div class="card" id="setList"></div>
    <button class="btn small" data-back="1" id="setBack">返回</button>
  </div>

  <button id="pauseBtn" hidden aria-label="暫停"><i></i><i></i></button>

  <div id="pauseMenu" class="screen" hidden>
    <h2 class="h2">暫停中</h2>
    <button class="btn gold" id="pResume">繼續遊戲</button>
    <button class="btn" id="pRestart">重新開始</button>
    <button class="btn" id="pHome" data-back="1">回標題頁</button>
  </div>
  <div id="countdown" class="screen" hidden><b id="cdNum">3</b></div>

  <div id="levelup" class="screen" hidden>
    <h2 class="h2">升級了！選一個強化</h2>
    <div id="lvOpts"></div>
  </div>

  <div id="result" class="screen" hidden>
    <div class="card" id="resBox"></div>
  </div>
  <canvas id="confetti" width="960" height="1400"></canvas>
</div>
</div>

/* ---------- 工具 ---------- */
function srand(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return (s-1)/2147483646}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
function star4(c,x,y,r){c.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,rr=i%2?r*.38:r;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath()}
function star5(c,x,y,r,rot){c.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2+(rot||0),rr=i%2?r*.5:r;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath()}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function outlineText(c,txt,x,y,fill,stroke,lw){c.lineJoin='round';c.lineWidth=lw||5;c.strokeStyle=stroke;c.strokeText(txt,x,y);c.fillStyle=fill;c.fillText(txt,x,y)}
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

function initAudio(){
  if(!sfxCtx){try{sfxCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){sfxCtx=null}}
  if(sfxCtx&&sfxCtx.state==='suspended')sfxCtx.resume();
}
function tone(type,f0,f1,dur,vol,delay){
  if(!sfxCtx||!settings.sfx)return;
  const t=sfxCtx.currentTime+(delay||0),o=sfxCtx.createOscillator(),g=sfxCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(sfxCtx.destination);o.start(t);o.stop(t+dur+0.03);
}
let noiseBuf=null;
function noise(freq,dur,vol,delay){
  if(!sfxCtx||!settings.sfx)return;
  if(!noiseBuf){noiseBuf=sfxCtx.createBuffer(1,sfxCtx.sampleRate*0.3,sfxCtx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const t=sfxCtx.currentTime+(delay||0),s=sfxCtx.createBufferSource(),f=sfxCtx.createBiquadFilter(),g=sfxCtx.createGain();
  s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(sfxCtx.destination);s.start(t);s.stop(t+dur+0.03);
}
let lastAtk=0,lastPick=0;
const sfx={
  click(){tone('sine',880,1320,0.09,0.22)},
  back(){tone('sine',720,440,0.12,0.22)},
  atkLow(){const n=performance.now();if(n-lastAtk<70)return;lastAtk=n;tone('triangle',240,90,0.14,0.28);noise(400,0.08,0.05)},
  atkHigh(){const n=performance.now();if(n-lastAtk<70)return;lastAtk=n;tone('square',1500,900,0.09,0.05);noise(3500,0.06,0.03)},
  combo(){[1047,1319,1568].forEach((f,i)=>tone('sine',f,f*1.002,0.12,0.2,i*0.07))},
  pick(){const n=performance.now();if(n-lastPick<60)return;lastPick=n;tone('sine',1200,1500,0.04,0.05)},
  reveal(i){const f=392*Math.pow(2,i/5);tone('triangle',f,f*1.01,0.28,0.3);tone('triangle',f*1.5,f*1.5,0.2,0.12,0.06)}
};

/* 背景音樂（用 audio 元素，和音效的 AudioContext 分開） */
const mus={el:null,key:null,timer:null,fade:null};
function setVol(v){if(mus.el)mus.el.volume=clamp(v,0,1)}
function stopMusic(fadeSec){
  const el=mus.el;if(!el)return;mus.el=null;mus.key=null;
  clearInterval(mus.fade);
  if(!fadeSec){el.pause();return}
  const v0=el.volume,t0=performance.now();
  const iv=setInterval(()=>{const k=(performance.now()-t0)/(fadeSec*1000);if(k>=1){clearInterval(iv);el.pause()}else el.volume=clamp(v0*(1-k),0,1)},50);
}
function playMusic(key,vol,fadeIn,loop){
  if(mus.key===key&&mus.el)return;
  if(mus.el)stopMusic(0.5);
  if(!MUSIC[key]||!settings.music)return;
  const el=new Audio(MUSIC[key]);el.loop=!!loop;el.volume=0;mus.el=el;mus.key=key;
  el.play().catch(()=>{});
  clearInterval(mus.fade);
  const t0=performance.now();
  mus.fade=setInterval(()=>{if(mus.el!==el){clearInterval(mus.fade);return}
    const k=(performance.now()-t0)/(fadeIn*1000);
    if(k>=1){el.volume=vol;clearInterval(mus.fade)}else el.volume=vol*k},50);
  if(key==='awards'){el.addEventListener('timeupdate',()=>{
    if(el.duration&&el.currentTime>el.duration-2&&mus.el===el&&!el._f){el._f=1;stopMusic(1.8)}})}
}
function menuMusic(){playMusic('menu',0.55,1.2,true)}

const sprURL=id=>{const s=SPR[id];return s instanceof HTMLCanvasElement?s.toDataURL():s.src};
function sprDims(id){const s=SPR[id];return [s.naturalWidth||s.width,s.naturalHeight||s.height]}
function sprReady(id){const s=SPR[id];return s instanceof HTMLCanvasElement||(s.complete&&s.naturalWidth>0)}
function drawSprite(c,id,cx,cy,h,rot,alpha){
  if(!sprReady(id))return;
  const [sw,sh]=sprDims(id),w=sw*h/sh;
  c.save();c.globalAlpha=alpha==null?1:alpha;c.translate(cx,cy);if(rot)c.rotate(rot);
  c.drawImage(SPR[id],-w/2,-h/2,w,h);c.restore();
}
const tmpC=document.createElement('canvas'),tmpX=tmpC.getContext('2d');
function drawTinted(c,id,cx,cy,h,col,a){
  if(!sprReady(id)||a<=0)return;
  const [sw,sh]=sprDims(id),w=sw*h/sh;
  tmpC.width=Math.ceil(w*R);tmpC.height=Math.ceil(h*R);
  tmpX.clearRect(0,0,tmpC.width,tmpC.height);
  tmpX.globalCompositeOperation='source-over';tmpX.drawImage(SPR[id],0,0,tmpC.width,tmpC.height);
  tmpX.globalCompositeOperation='source-atop';tmpX.fillStyle=col;tmpX.fillRect(0,0,tmpC.width,tmpC.height);
  c.save();c.globalAlpha=a;c.drawImage(tmpC,cx-w/2,cy-h/2,w,h);c.restore();
}

function drawEnemy(c,e,t,x,y){
  c.save();c.translate(x,y);
  const r=e.r;
  if(e.type==='dango'){
    const bob=Math.sin(t*7+e.ph)*1.5;
    c.fillStyle='rgba(59,42,120,.14)';c.beginPath();c.ellipse(0,r*.95,r*.8,r*.25,0,0,7);c.fill();
    c.fillStyle=DANGO_COL[e.col];c.beginPath();c.arc(0,bob,r,0,7);c.fill();
    c.fillStyle='rgba(255,255,255,.5)';c.beginPath();c.ellipse(-r*.35,bob-r*.45,r*.28,r*.16,-.6,0,7);c.fill();
    c.translate(0,bob);face(c,r,e.flash>0);
  }else if(e.type==='bouncy'){
    const h=Math.abs(Math.sin(t*5+e.ph)),sq=1+(1-h)*.14;
    c.fillStyle='rgba(59,42,120,.14)';c.beginPath();c.ellipse(0,r+4,r*(.9-h*.3),r*.22,0,0,7);c.fill();
    c.translate(0,-h*12);c.scale(1/sq*1.05,sq*.97);
    c.fillStyle='#8fd0ff';c.beginPath();c.arc(0,0,r,0,7);c.fill();
    c.strokeStyle='rgba(255,255,255,.75)';c.lineWidth=3;c.beginPath();c.arc(0,0,r*.78,-.9*Math.PI,-.3*Math.PI);c.stroke();
    face(c,r,e.flash>0);
  }else if(e.type==='jelly'){
    const w=1+Math.sin(t*5+e.ph)*.06;c.scale(w,2-w);
    c.fillStyle='rgba(59,42,120,.14)';c.beginPath();c.ellipse(0,r*.95,r*.8,r*.22,0,0,7);c.fill();
    c.fillStyle='#ffe27a';c.strokeStyle='#ffe27a';c.lineJoin='round';c.lineWidth=7;
    star5(c,0,0,r*.92,0);c.fill();c.stroke();
    c.fillStyle='rgba(255,255,255,.5)';c.beginPath();c.ellipse(-r*.3,-r*.35,r*.2,r*.1,-.6,0,7);c.fill();
    face(c,r*.8,e.flash>0);
  }else{ // 大布丁
    c.fillStyle='rgba(59,42,120,.16)';c.beginPath();c.ellipse(0,r*.95,r*1.1,r*.25,0,0,7);c.fill();
    c.fillStyle='#ffe08a';c.beginPath();c.moveTo(-r*.8,-r*.35);c.lineTo(r*.8,-r*.35);c.lineTo(r*1.0,r*.85);c.quadraticCurveTo(0,r*1.05,-r*1.0,r*.85);c.closePath();c.fill();
    c.fillStyle='#c47a3a';c.beginPath();c.moveTo(-r*.9,-r*.4);
    c.bezierCurveTo(-r*.9,-r*1.0,r*.9,-r*1.0,r*.9,-r*.4);
    c.lineTo(r*.9,-r*.2);[.6,.3,0,-.3,-.6].forEach((d,i)=>c.quadraticCurveTo(r*d+r*.12,r*(i%2?.0:.28),r*d-r*.12,-r*.2));
    c.lineTo(-r*.9,-r*.2);c.closePath();c.fill();
    c.fillStyle='#ff5a7a';c.beginPath();c.arc(0,-r*.95,r*.2,0,7);c.fill();c.fillStyle='rgba(255,255,255,.7)';c.beginPath();c.arc(-r*.07,-r*1.0,r*.06,0,7);c.fill();
    c.translate(0,r*.28);face(c,r*.8,e.flash>0);c.translate(0,-r*.28);
    c.fillStyle='rgba(255,255,255,.6)';rr(c,-r*.8,-r*1.4,r*1.6,7,3.5);c.fill();
    c.fillStyle='#ff5fae';rr(c,-r*.8,-r*1.4,r*1.6*Math.max(0,e.hp/e.maxHp),7,3.5);c.fill();
  }
  if(e.flash>0){c.globalAlpha=Math.min(.6,e.flash*5);c.fillStyle='#fff';c.beginPath();c.arc(0,0,r*1.05,0,7);c.fill()}
  c.restore();
}

const PCX=240,PCY=360;
function newGame(){
  const ch=CONFIG.chars.find(x=>x.id===mainId),P=CONFIG.player;
  G={
    t:0,x:0,y:0,fx:0,fy:1,hp:P.hp,maxHp:P.hp,inv:0,
    lv:1,xp:0,need:Math.round(CONFIG.xp.first),pending:0,
    kills:0,combo:0,maxCombo:0,
    st:{dmg:1,rate:1,speed:1,pickup:1},
    wl:{star:0,orbit:0,sweep:0},
    cd:{star:0.3,sweep:1.2},orbA:0,
    sw:{t:-1,ang:0,hit:null,tick:0},
    en:[],pr:[],pk:[],pa:[],bub:[],fxs:[],
    spawnT:0.5,bossN:0,
    glow:{c:'',t:0,pri:0},
    cheer:{vis:!!settings.cheer,a:settings.cheer?1:0,aho:0},
    over:false,win:false,fxT:0,mainWeapon:ch.weapon
  };
  G.wl[ch.weapon]=1;
}
function glow(kind,sec){
  const pri={yellow:1,blue:2,red:3}[kind];
  if(G.glow.t>0&&G.glow.pri>pri&&G.glow.t>.1)return;
  G.glow={c:{yellow:'#ffd54a',blue:'#6cc3ff',red:'#ff4d6d'}[kind],t:sec,pri,max:sec};
}
const wlv=k=>G.wl[k]-1;
function nearestEnemy(range){
  let best=null,bd=range*range;
  for(const e of G.en){const dx=e.x-G.x,dy=e.y-G.y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=e}}
  return best;
}
function spawnEnemy(type){
  const d=CONFIG.enemies[type],a=Math.random()*Math.PI*2,dist=rnd(CONFIG.spawn.ringMin,CONFIG.spawn.ringMax);
  const hp=d.hp*(1+G.t*CONFIG.scaling.hpPerSec);
  G.en.push({type,x:G.x+Math.cos(a)*dist,y:G.y+Math.sin(a)*dist,hp,maxHp:hp,r:d.r,spd:d.speed*rnd(.9,1.1),dmg:d.dmg,xp:d.xp,
    flash:0,ph:Math.random()*6,col:Math.floor(Math.random()*4),kx:0,ky:0,orbT:-9});
}
function pickType(){
  const list=Object.entries(CONFIG.enemies).filter(([k,d])=>!d.boss&&G.t>=d.from);
  let tot=0;list.forEach(([k,d])=>tot+=d.w);let r=Math.random()*tot;
  for(const [k,d] of list){r-=d.w;if(r<=0)return k}
  return list[0][0];
}
function hurtEnemy(e,dmg,kind){
  e.hp-=dmg*G.st.dmg;e.flash=.12;
  const dx=e.x-G.x,dy=e.y-G.y,d=Math.hypot(dx,dy)||1;e.kx+=dx/d*60;e.ky+=dy/d*60;
  glow('blue',.25);
  for(let i=0;i<3;i++)G.pa.push({x:e.x,y:e.y,vx:rnd(-60,60),vy:rnd(-60,60),life:.4,max:.4,k:'spark',col:i%2?'#fff':'#6cc3ff',s:4});
  if(e.hp<=0&&!e.dead){e.dead=true;killEnemy(e)}
}
function killEnemy(e){
  G.kills++;G.combo++;if(G.combo>G.maxCombo)G.maxCombo=G.combo;
  G.pk.push({x:e.x,y:e.y,v:e.xp,ph:Math.random()*6});
  if(e.type==='pudding')for(let i=0;i<8;i++)G.pk.push({x:e.x+rnd(-30,30),y:e.y+rnd(-30,30),v:e.xp/4,ph:i});
  for(let i=0;i<6;i++)G.pa.push({x:e.x,y:e.y,vx:rnd(-90,90),vy:rnd(-90,90),life:.5,max:.5,k:'pop',col:'#fff',s:3+Math.random()*3});
  if(G.combo%CONFIG.combo.bubbleEvery===0){G.bub.push({t:0,txt:G.combo+' combo!'});sfx.combo()}
  if(G.combo>=CONFIG.combo.cheerAt)G.cheer.vis=true;
}
function hurtPlayer(dmg){
  if(G.inv>0||G.over)return;
  G.hp-=dmg;G.inv=CONFIG.player.invuln;glow('red',.5);sfx.atkLow();
  if(G.combo>0||G.cheer.vis){G.cheer.aho=CONFIG.combo.ahoSec}
  G.combo=0;
  if(G.hp<=0){G.hp=0;endGame(false)}
}
function addXp(v){
  G.xp+=v;
  while(G.xp>=G.need){G.xp-=G.need;G.lv++;G.need=Math.round(CONFIG.xp.first*Math.pow(CONFIG.xp.growth,G.lv-1));G.pending++}
  if(G.pending>0&&state==='play')openLevelUp();
}
function moveVector(){
  if(settings.auto)return autoMove();
  let x=0,y=0;
  if(keys.ArrowLeft||keys.KeyA)x--;if(keys.ArrowRight||keys.KeyD)x++;
  if(keys.ArrowUp||keys.KeyW)y--;if(keys.ArrowDown||keys.KeyS)y++;
  if(x||y){const l=Math.hypot(x,y);return [x/l,y/l,1]}
  if(joy.on){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy);if(d>6){const m=Math.min(1,d/50);return [dx/d,dy/d,m]}}
  return [0,0,0];
}
function autoMove(){
  let ax=0,ay=0;
  const melee=G.wl.star===0&&G.wl.sweep===0,fr=melee?95:170;
  for(const e of G.en){const dx=G.x-e.x,dy=G.y-e.y,d=Math.hypot(dx,dy)||1;
    if(d<fr){const w=(fr-d)/fr;ax+=dx/d*w*w*3;ay+=dy/d*w*w*3;ax+=-dy/d*w*.6;ay+=dx/d*w*.6}}
  if(melee&&G.hp>G.maxHp*.35){const t=nearestEnemy(320);if(t){const d=Math.hypot(t.x-G.x,t.y-G.y)||1;if(d>70){ax+=(t.x-G.x)/d*.9;ay+=(t.y-G.y)/d*.9}}}
  let bp=null,bd=1e9;
  for(const p of G.pk){const d=Math.hypot(p.x-G.x,p.y-G.y);if(d<bd){bd=d;bp=p}}
  if(bp&&bd<260){const d=bd||1;ax+=(bp.x-G.x)/d*.5;ay+=(bp.y-G.y)/d*.5}
  const l=Math.hypot(ax,ay);if(l<.05)return [0,0,0];
  return [ax/l,ay/l,Math.min(1,l)];
}
function update(dt){
  const g=G,P=CONFIG.player,Wn=CONFIG.weapons;
  g.t+=dt;if(g.t>=CONFIG.gameSeconds){endGame(true);return}
  if(g.inv>0)g.inv-=dt;
  if(g.glow.t>0)g.glow.t-=dt;
  // 移動
  const [mx,my,mm]=moveVector();
  if(mm>0){g.fx=mx;g.fy=my}
  g.x+=mx*mm*P.speed*g.st.speed*dt;g.y+=my*mm*P.speed*g.st.speed*dt;
  // 生怪
  const sp=CONFIG.spawn;g.spawnT-=dt;
  if(g.spawnT<=0){
    g.spawnT=Math.max(sp.min,sp.start-g.t*sp.decayPerSec);
    const batch=1+Math.floor(g.t/sp.batchEverySec);
    for(let i=0;i<batch&&g.en.length<sp.maxEnemies;i++)spawnEnemy(pickType());
  }
  if(g.t>=(g.bossN+1)*CONFIG.bossEverySec&&g.t<CONFIG.gameSeconds-8){g.bossN++;spawnEnemy('pudding')}
  // 敵人
  for(let i=0;i<g.en.length;i++){
    const e=g.en[i],dx=g.x-e.x,dy=g.y-e.y,d=Math.hypot(dx,dy)||1;
    let sp2=e.spd;if(e.type==='bouncy')sp2*=.35+Math.abs(Math.sin(T*5+e.ph))*1.3;
    e.x+=(dx/d*sp2+e.kx)*dt;e.y+=(dy/d*sp2+e.ky)*dt;e.kx*=.86;e.ky*=.86;
    if(e.flash>0)e.flash-=dt;
    if(d<e.r+P.radius)hurtPlayer(e.dmg);
    if(d>950){e.dead=true;e.gone=true}
    if(i%2===(Math.floor(g.t*30)%2)){
      for(let j=i+1;j<g.en.length;j++){const o=g.en[j],ox=e.x-o.x,oy=e.y-o.y,od=Math.hypot(ox,oy)||1,mn=(e.r+o.r)*.8;
        if(od<mn){const pu=(mn-od)*.25;e.x+=ox/od*pu;e.y+=oy/od*pu;o.x-=ox/od*pu;o.y-=oy/od*pu}}
    }
  }
  // 武器：星星彈
  if(g.wl.star>0){
    g.cd.star-=dt;
    if(g.cd.star<=0){
      const L=wlv('star'),t=nearestEnemy(Wn.star.range);
      if(t){
        g.cd.star=Wn.star.cd[L]/g.st.rate;
        const base=Math.atan2(t.y-g.y,t.x-g.x),n=Wn.star.count[L];
        for(let i=0;i<n;i++){const a=base+(i-(n-1)/2)*.2;
          g.pr.push({x:g.x,y:g.y,vx:Math.cos(a)*Wn.star.speed,vy:Math.sin(a)*Wn.star.speed,dmg:Wn.star.dmg[L],pierce:Wn.star.pierce[L],life:Wn.star.range/Wn.star.speed,hit:new Set(),rot:0})}
        sfx.atkLow();glow('yellow',.12);
      }else g.cd.star=.15;
    }
  }
  for(const p of g.pr){
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.rot+=dt*8;
    if(Math.random()<.5)g.pa.push({x:p.x,y:p.y,vx:0,vy:0,life:.3,max:.3,k:'spark',col:['#ff7eb6','#ffd54a','#6cc3ff','#8be0a8'][Math.floor(Math.random()*4)],s:4});
    for(const e of g.en){if(e.dead||p.hit.has(e))continue;
      if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+8){p.hit.add(e);hurtEnemy(e,p.dmg);
        if(p.pierce>0)p.pierce--;else p.life=0;if(p.life<=0)break}}
  }
  // 武器：魔法光環
  if(g.wl.orbit>0){
    const L=wlv('orbit'),o=Wn.orbit;g.orbA+=o.spin*dt;
    const n=o.count[L],rad=o.radius[L];
    for(let i=0;i<n;i++){
      const a=g.orbA+i*Math.PI*2/n,ox=g.x+Math.cos(a)*rad,oy=g.y+Math.sin(a)*rad;
      for(const e of g.en){if(e.dead)continue;
        if(Math.hypot(e.x-ox,e.y-oy)<e.r+10&&g.t-e.orbT>o.hitCd){e.orbT=g.t;hurtEnemy(e,o.dmg[L]);sfx.atkHigh()}}
    }
  }
  // 武器：長條掃擊
  if(g.wl.sweep>0){
    const L=wlv('sweep'),s=Wn.sweep;
    if(g.sw.t<0){
      g.cd.sweep-=dt;
      if(g.cd.sweep<=0){
        const t=nearestEnemy(320),a=t?Math.atan2(t.y-g.y,t.x-g.x):Math.atan2(g.fy,g.fx);
        g.sw={t:0,ang:a,hit:new Set(),tick:0};g.cd.sweep=s.cd[L]/g.st.rate;sfx.atkHigh();glow('yellow',.15);
      }
    }else{
      g.sw.t+=dt;g.sw.tick+=dt;
      if(g.sw.tick>=s.dur/2){g.sw.tick=0;g.sw.hit=new Set()}
      const prog=Math.min(1,g.sw.t/(s.dur*.4)),len=s.len[L]*prog,wd=s.width[L];
      const ca=Math.cos(g.sw.ang),sa=Math.sin(g.sw.ang);
      for(const e of g.en){if(e.dead||g.sw.hit.has(e))continue;
        const rx=e.x-g.x,ry=e.y-g.y,al=rx*ca+ry*sa,pe=Math.abs(-rx*sa+ry*ca);
        if(al>-10&&al<len+e.r&&pe<wd/2+e.r){g.sw.hit.add(e);hurtEnemy(e,s.dmg[L])}}
      if(g.sw.t>=s.dur)g.sw.t=-1;
    }
  }
  // 清理 + 掉落物
  g.en=g.en.filter(e=>!e.dead);
  g.pr=g.pr.filter(p=>p.life>0);
  const pr=P.pickup*g.st.pickup;
  for(const p of g.pk){
    const dx=g.x-p.x,dy=g.y-p.y,d=Math.hypot(dx,dy);
    if(d<pr||p.mag){p.mag=true;const sp3=260+(pr-Math.min(d,pr))*0;p.x+=dx/(d||1)*sp3*dt;p.y+=dy/(d||1)*sp3*dt}
    if(d<14){p.got=true;addXp(p.v);sfx.pick();glow('yellow',.12)}
  }
  g.pk=g.pk.filter(p=>!p.got);
  if(g.pk.length>260)g.pk.splice(0,g.pk.length-260);
  // 粒子
  for(const p of g.pa){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}
  g.pa=g.pa.filter(p=>p.life>0);if(g.pa.length>300)g.pa.splice(0,g.pa.length-300);
  for(const b of g.bub)b.t+=dt;g.bub=g.bub.filter(b=>b.t<1.5);
  // 連擊特效
  if(g.combo>=CONFIG.combo.fxAt){
    g.fxT-=dt;
    if(g.fxT<=0){g.fxT=theme==='forest'?1.1:theme==='night'?.9:.12;spawnFx()}
  }
  for(const f of g.fxs){f.x+=f.vx*dt;f.y+=f.vy*dt;f.t+=dt;f.r+=f.vr*dt}
  g.fxs=g.fxs.filter(f=>f.x>-120&&f.x<W+120&&f.y>-120&&f.y<H+120&&f.t<8);
  // 啦啦隊
  const ch=g.cheer;
  if(ch.aho>0){ch.aho-=dt;if(ch.aho<=0){ch.vis=settings.cheer||g.combo>=CONFIG.combo.cheerAt}}
  else if(!ch.vis&&(settings.cheer||g.combo>=CONFIG.combo.cheerAt))ch.vis=true;
  ch.a+=((ch.vis?1:0)-ch.a)*Math.min(1,dt*6);
}
function spawnFx(){
  const g=G;
  if(theme==='cloud')g.fxs.push({k:'rib',x:rnd(0,W),y:-20,vx:rnd(-20,20),vy:rnd(70,130),r:rnd(0,6),vr:rnd(-3,3),t:0,col:['#ff7eb6','#ffd54a','#6cc3ff','#8be0a8','#b58cf0'][Math.floor(Math.random()*5)]});
  else if(theme==='night')g.fxs.push({k:'comet',x:rnd(W*.3,W+60),y:rnd(-40,200),vx:-rnd(260,360),vy:rnd(160,230),r:0,vr:0,t:0});
  else{const dir=Math.random()<.5?1:-1;g.fxs.push({k:'bird',x:dir>0?-40:W+40,y:rnd(90,330),vx:dir*rnd(90,140),vy:rnd(-12,12),r:0,vr:0,t:0,ph:Math.random()*6})}
}

/* ====================================================================
   升級選項
   ==================================================================== */
function sweepName(){return {cloud:'冰淇淋長條掃擊',night:'銀河長條掃擊',forest:'花藤長條掃擊'}[theme]}
function wName(k){return k==='sweep'?sweepName():CONFIG.weapons[k].name}
const WDESC={star:'自動朝最近的敵人射出星星，升級增加發數與穿透。',orbit:'光球繞著你旋轉，碰到的敵人都會受傷。',sweep:'定時朝敵人方向掃出一條長條，一次打中一整排。'};
const WICON={star:'★',orbit:'◎',sweep:'≈'};
function buildChoices(){
  const out=[],U=CONFIG.upgrades,max=CONFIG.maxWeaponLevel;
  const owned=Object.keys(G.wl).filter(k=>G.wl[k]>0).length;
  Object.keys(G.wl).forEach(k=>{
    if(G.wl[k]>0&&G.wl[k]<max)out.push({k:'w:'+k,ic:WICON[k],title:wName(k)+' Lv'+(G.wl[k]+1),d:'武器強化：'+WDESC[k]});
    else if(G.wl[k]===0&&owned<3)out.push({k:'w:'+k,ic:WICON[k],title:wName(k),tag:'新武器',d:WDESC[k]});
  });
  out.push({k:'dmg',ic:'⚔',title:'攻擊力 +'+Math.round(U.dmg*100)+'%',d:'所有武器的傷害提高。'});
  out.push({k:'rate',ic:'»',title:'攻速 +'+Math.round(U.rate*100)+'%',d:'武器更快再次發動。'});
  out.push({k:'speed',ic:'➜',title:'移動速度 +'+Math.round(U.speed*100)+'%',d:'跑得更快，更好閃避。'});
  out.push({k:'pickup',ic:'✦',title:'吸取範圍 +'+Math.round(U.pickup*100)+'%',d:'更遠的掉落物會自動飛向你。'});
  out.push({k:'hp',ic:'♥',title:'最大生命 +'+U.hp,d:'提高生命上限並回復同樣的量。'});
  out.push({k:'heal',ic:'✚',title:'回復生命',d:'立刻回復 '+Math.round(U.healPct*100)+'% 的最大生命。'});
  for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}
  // 武器選項優先至少出現一個
  const w=out.filter(o=>o.k.startsWith('w:')),rest=out.filter(o=>!o.k.startsWith('w:'));
  const pick=[];if(w.length)pick.push(w[0]);
  [...w.slice(1),...rest].sort(()=>Math.random()-.5).forEach(o=>{if(pick.length<3)pick.push(o)});
  return pick;
}
function applyChoice(o){
  const U=CONFIG.upgrades;
  if(o.k.startsWith('w:'))G.wl[o.k.slice(2)]++;
  else if(o.k==='dmg')G.st.dmg+=U.dmg;
  else if(o.k==='rate')G.st.rate+=U.rate;
  else if(o.k==='speed')G.st.speed+=U.speed;
  else if(o.k==='pickup')G.st.pickup+=U.pickup;
  else if(o.k==='hp'){G.maxHp+=U.hp;G.hp=Math.min(G.maxHp,G.hp+U.hp)}
  else if(o.k==='heal')G.hp=Math.min(G.maxHp,G.hp+G.maxHp*U.healPct);
}
function openLevelUp(){
  state='levelup';glow('yellow',.8);sfx.combo();
  const box=$('#lvOpts');box.innerHTML='';
  buildChoices().forEach(o=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML=`<div class="ic">${o.ic}</div><div><b>${o.title}${o.tag?`<span class="tag">${o.tag}</span>`:''}</b><span class="d">${o.d}</span></div>`;
    b.addEventListener('click',()=>{sfx.click();applyChoice(o);G.pending--;
      if(G.pending>0)openLevelUp();else{$('#levelup').hidden=true;state='play';G.inv=Math.max(G.inv,.8)}});
    box.appendChild(b);
  });
  $('#levelup').hidden=false;
}

/* ====================================================================
   繪製（遊戲世界 + HUD）
   ==================================================================== */
const sx=x=>x-G.x+PCX,sy=y=>y-G.y+PCY;
function drawWorld(c){
  const g=G;
  // 掉落物
  for(const p of g.pk){const x=sx(p.x),y=sy(p.y);if(x<-20||x>W+20||y<-20||y>H+20)continue;drawPickup(c,x,y,T,p.ph)}
  // 長條武器（在敵人下方）
  if(g.sw.t>=0&&g.wl.sweep>0){
    const L=wlv('sweep'),s=CONFIG.weapons.sweep,prog=Math.min(1,g.sw.t/(s.dur*.4)),fade=g.sw.t>s.dur*.7?1-(g.sw.t-s.dur*.7)/(s.dur*.3):1;
    c.save();c.translate(PCX,PCY);c.rotate(g.sw.ang);c.globalAlpha=clamp(fade,0,1);drawBar(c,s.len[L]*prog,s.width[L],prog,T);c.restore();
  }
  // 敵人（依 y 排序）
  const list=g.en.slice().sort((a,b)=>a.y-b.y);
  for(const e of list){const x=sx(e.x),y=sy(e.y);if(x<-60||x>W+60||y<-70||y>H+60)continue;drawEnemy(c,e,T,x,y)}
  // 粒子
  for(const p of g.pa){const a=p.life/p.max,x=sx(p.x),y=sy(p.y);c.globalAlpha=a;c.fillStyle=p.col;
    if(p.k==='spark'){star4(c,x,y,p.s*(.5+a));c.fill()}else{c.beginPath();c.arc(x,y,p.s*(1.2-a*.5),0,7);c.fill()}}
  c.globalAlpha=1;
  // 彈幕
  for(const p of g.pr){const x=sx(p.x),y=sy(p.y);
    c.fillStyle='#ffd54a';c.strokeStyle='#ff5fae';c.lineWidth=2.5;c.lineJoin='round';star5(c,x,y,11,p.rot);c.fill();c.stroke();
    c.fillStyle='#fff6c4';star5(c,x,y,5,p.rot);c.fill()}
  // 主角
  const P=CONFIG.player;
  if(g.glow.t>0){
    const k=clamp(g.glow.t/(g.glow.max||.3),0,1);
    const gr=c.createRadialGradient(PCX,PCY,6,PCX,PCY,62);gr.addColorStop(0,g.glow.c);gr.addColorStop(1,'rgba(255,255,255,0)');
    c.globalAlpha=.55*k;c.fillStyle=gr;c.beginPath();c.arc(PCX,PCY,62,0,7);c.fill();c.globalAlpha=1;
  }
  if(theme!=='cloud'){const hg=c.createRadialGradient(PCX,PCY,10,PCX,PCY,56);hg.addColorStop(0,'rgba(255,255,255,.34)');hg.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=hg;c.beginPath();c.arc(PCX,PCY,56,0,7);c.fill()}
  drawSprite(c,mainId,PCX,PCY,P.height,0,1);
  if(g.glow.t>0)drawTinted(c,mainId,PCX,PCY,P.height,g.glow.c,.55*clamp(g.glow.t/(g.glow.max||.3),0,1));
  // 光環
  if(g.wl.orbit>0){
    const L=wlv('orbit'),o=CONFIG.weapons.orbit,n=o.count[L],rad=o.radius[L];
    for(let i=0;i<n;i++){const a=g.orbA+i*Math.PI*2/n,x=PCX+Math.cos(a)*rad,y=PCY+Math.sin(a)*rad;
      const gr=c.createRadialGradient(x,y,2,x,y,20);gr.addColorStop(0,'rgba(255,180,240,.95)');gr.addColorStop(1,'rgba(180,120,255,0)');
      c.fillStyle=gr;c.beginPath();c.arc(x,y,20,0,7);c.fill();
      c.fillStyle='#fff';c.beginPath();c.arc(x,y,6,0,7);c.fill();c.fillStyle='#b58cf0';c.beginPath();c.arc(x,y,3.5,0,7);c.fill()}
  }
  // combo 泡泡
  for(const b of g.bub){
    const k=b.t/1.5,pop=b.t<.25?1.15*Math.sin(b.t/.25*Math.PI/2*1.1):1,sc=b.t<.25?pop:1,al=k>.75?1-(k-.75)/.25:1,yy=PCY-62-k*46;
    c.save();c.translate(PCX,yy);c.scale(sc,sc);c.globalAlpha=al;
    c.font='900 20px '+FONT;const w=c.measureText(b.txt).width+28;
    c.fillStyle='#fff';c.strokeStyle='#ff5fae';c.lineWidth=3.5;
    rr(c,-w/2,-18,w,34,17);c.fill();c.stroke();
    c.beginPath();c.moveTo(-7,15);c.lineTo(0,25);c.lineTo(7,15);c.closePath();c.fillStyle='#fff';c.fill();
    c.beginPath();c.moveTo(-7,16);c.lineTo(0,25);c.lineTo(7,16);c.strokeStyle='#ff5fae';c.stroke();
    c.fillStyle='#fff';c.fillRect(-6,13,12,5);
    c.fillStyle='#ff5fae';c.textAlign='center';c.textBaseline='middle';c.fillText(b.txt,0,0);c.restore();
  }
}
function drawFx(c){
  for(const f of G.fxs){
    c.save();c.translate(f.x,f.y);
    if(f.k==='rib'){c.rotate(f.r);c.strokeStyle=f.col;c.lineWidth=5;c.lineCap='round';c.globalAlpha=.85;c.beginPath();c.moveTo(0,-16);c.bezierCurveTo(10,-6,-10,6,0,16);c.stroke()}
    else if(f.k==='comet'){const a=Math.atan2(f.vy,f.vx),gr=c.createLinearGradient(0,0,-Math.cos(a)*130,-Math.sin(a)*130);
      gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(1,'rgba(150,200,255,0)');
      c.strokeStyle=gr;c.lineWidth=6;c.lineCap='round';c.beginPath();c.moveTo(0,0);c.lineTo(-Math.cos(a)*130,-Math.sin(a)*130);c.stroke();
      c.fillStyle='#fff';c.beginPath();c.arc(0,0,6,0,7);c.fill()}
    else{const fl=Math.sin(T*10+f.ph)*5,d=f.vx>0?1:-1;c.scale(d,1);c.strokeStyle='#2b4a3a';c.lineWidth=3;c.lineCap='round';c.beginPath();c.moveTo(-14,-fl);c.quadraticCurveTo(-6,-8-fl,0,0);c.quadraticCurveTo(6,-8-fl,14,-fl);c.stroke()}
    c.restore();
  }
}
function drawCheer(c){
  const ch=G.cheer;if(ch.a<.02)return;
  const others=CONFIG.chars.filter(x=>x.id!==mainId);
  c.save();c.globalAlpha=ch.a;
  others.forEach((o,i)=>{const x=44+i*62,sw=Math.sin(T*5+i*1.3)*.14;drawSprite(c,o.id,x,118,52,sw,1)});
  const aho=ch.aho>0;
  c.font='900 24px '+FONT;c.textAlign='left';c.textBaseline='middle';
  const txt=aho?'阿喔!':(G.combo>=CONFIG.combo.cheerAt||settings.cheer?'加油~~':'');
  if(txt)outlineText(c,txt,360,118,aho?'#ff3b6b':'#ff5fae','#fff',6);
  c.restore();
}
function drawHud(c){
  const h=THEMES[theme].hud;
  c.save();c.textBaseline='middle';
  // 經驗條
  c.fillStyle='rgba(255,255,255,.5)';rr(c,12,8,W-24,14,7);c.fill();
  c.fillStyle='#ffd54a';rr(c,12,8,Math.max(14,(W-24)*G.xp/G.need),14,7);c.fill();
  c.strokeStyle='#ff5fae';c.lineWidth=2.5;rr(c,12,8,W-24,14,7);c.stroke();
  // 生命
  c.fillStyle='rgba(255,255,255,.55)';rr(c,12,32,150,18,9);c.fill();
  c.fillStyle='#ff5fae';rr(c,12,32,Math.max(18,150*G.hp/G.maxHp),18,9);c.fill();
  c.strokeStyle='#fff';c.lineWidth=2.5;rr(c,12,32,150,18,9);c.stroke();
  c.font='800 13px '+FONT;c.textAlign='left';outlineText(c,'HP '+Math.ceil(G.hp)+'/'+G.maxHp,22,41.5,'#fff','#b02e7a',4);
  c.font='900 18px '+FONT;outlineText(c,'Lv.'+G.lv,14,66,h.fill,h.stroke,5);
  c.font='800 15px '+FONT;outlineText(c,'擊倒 '+G.kills,70,66,h.fill,h.stroke,4);
  if(G.combo>0){c.font='900 20px '+FONT;outlineText(c,'連擊 '+G.combo,14,90,G.combo>=CONFIG.combo.fxAt?'#ff5fae':h.fill,h.stroke,5)}
  c.textAlign='center';c.font='900 26px '+FONT;outlineText(c,fmt(CONFIG.gameSeconds-G.t),PCX,52,h.fill,h.stroke,6);
  c.font='700 12px '+FONT;c.textAlign='left';
  const ws=Object.keys(G.wl).filter(k=>G.wl[k]>0).map(k=>wName(k)+' Lv'+G.wl[k]).join('  ·  ');
  outlineText(c,ws,12,H-14,h.fill,h.stroke,4);
  // 虛擬搖桿
  if(joy.on&&!settings.auto){
    c.globalAlpha=.55;c.fillStyle='#fff';c.strokeStyle='#ff5fae';c.lineWidth=4;
    c.beginPath();c.arc(joy.ox,joy.oy,50,0,7);c.fill();c.stroke();
    const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.min(50,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);
    c.fillStyle='#ff5fae';c.beginPath();c.arc(joy.ox+Math.cos(a)*d,joy.oy+Math.sin(a)*d,22,0,7);c.fill();
  }
  if(settings.auto){c.globalAlpha=.9;c.font='800 13px '+FONT;c.textAlign='right';outlineText(c,'自動模式',W-14,H-14,h.fill,h.stroke,4)}
  c.restore();
}

/* ====================================================================
   輸入
   ==================================================================== */
const keys={};
const joy={on:false,id:null,ox:0,oy:0,x:0,y:0};
function stagePt(e){const r=stage.getBoundingClientRect(),s=r.width/W;return [(e.clientX-r.left)/s,(e.clientY-r.top)/s]}
stage.addEventListener('pointerdown',e=>{
  if(state!=='play'||e.target.closest('button'))return;
  const [x,y]=stagePt(e);joy.on=true;joy.id=e.pointerId;joy.ox=joy.x=x;joy.oy=joy.y=y;
  try{stage.setPointerCapture(e.pointerId)}catch(_){}
});
stage.addEventListener('pointermove',e=>{if(joy.on&&e.pointerId===joy.id){const [x,y]=stagePt(e);joy.x=x;joy.y=y}});
const endJoy=e=>{if(joy.on&&e.pointerId===joy.id)joy.on=false};
stage.addEventListener('pointerup',endJoy);stage.addEventListener('pointercancel',endJoy);
window.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if((e.code==='Escape'||e.code==='KeyP')&&!e.repeat){if(state==='play')pauseGame();else if(state==='pause')resumeGame()}
});
window.addEventListener('keyup',e=>{keys[e.code]=false});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;joy.on=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pauseGame()});

/* ====================================================================
   畫面切換與流程
   ==================================================================== */
const SCREENS=['splash','menu','chars','bgs','settings','pauseMenu','countdown','levelup','result'];
function show(id){SCREENS.forEach(s=>{if(s!==id)$('#'+s).hidden=true});if(id)$('#'+id).hidden=false}
function toMenu(){
  state='menu';show('menu');$('#pauseBtn').hidden=true;$('#menuChar').src=sprURL(mainId);menuMusic();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button.btn,.cc,.bc,.sw');if(!b)return;
  initAudio();
  if(b.dataset.back)sfx.back();else if(!b.classList.contains('sw'))sfx.click();
});
$('#splash').addEventListener('click',()=>{if(state!=='splash')return;initAudio();sfx.click();toMenu()});
$('#btnStart').addEventListener('click',startGame);
$('#btnChars').addEventListener('click',()=>{state='chars';buildChars();show('chars')});
$('#btnBgs').addEventListener('click',()=>{state='bgs';buildBgs();show('bgs')});
$('#btnSettings').addEventListener('click',()=>{state='settings';buildSettings();show('settings')});
['charsBack','bgsBack','setBack'].forEach(i=>$('#'+i).addEventListener('click',toMenu));

function buildChars(){
  const g=$('#charGrid');g.innerHTML='';
  CONFIG.chars.forEach(ch=>{
    const d=document.createElement('div');d.className='cc'+(ch.id===mainId?' sel':'');
    d.innerHTML=`<img alt="" src="${sprURL(ch.id)}"><span>${ch.name}</span>`;
    d.addEventListener('click',()=>{mainId=ch.id;buildChars()});
    g.appendChild(d);
  });
}
function buildBgs(){
  const g=$('#bgGrid');g.innerHTML='';
  Object.keys(THEMES).forEach(k=>{
    const d=document.createElement('div');d.className='bc'+(k===theme?' sel':'');
    const cn=document.createElement('canvas');cn.width=224;cn.height=326;
    const c=cn.getContext('2d');c.scale(224/W,326/H);BG[k](c,2,0);
    const l=document.createElement('span');l.textContent=THEMES[k].name;
    d.appendChild(cn);d.appendChild(l);
    d.addEventListener('click',()=>{theme=k;buildBgs()});
    g.appendChild(d);
  });
}
function buildSettings(){
  const L=$('#setList');L.innerHTML='';
  [['auto','自動模式','自動移動閃避，只需要選強化'],['cheer','加油團模式','啦啦隊一開始就在，受傷只會喊「阿喔!」'],['music','背景音樂',''],['sfx','音效','']].forEach(([k,t,s])=>{
    const r=document.createElement('div');r.className='row';
    r.innerHTML=`<div>${t}${s?`<small>${s}</small>`:''}</div>`;
    const b=document.createElement('button');b.className='sw'+(settings[k]?' on':'');b.setAttribute('aria-label',t);
    b.addEventListener('click',()=>{settings[k]=!settings[k];b.classList.toggle('on',settings[k]);
      if(k==='music'){if(settings.music)menuMusic();else stopMusic(.3)}});
    r.appendChild(b);L.appendChild(r);
  });
}

function startGame(){
  initAudio();newGame();state='play';show(null);$('#pauseBtn').hidden=false;stopMusic(1);
}
function pauseGame(){if(state!=='play')return;state='pause';joy.on=false;$('#pauseBtn').hidden=true;show('pauseMenu')}
let cdTimer=null;
function resumeGame(){
  if(state!=='pause')return;state='countdown';show('countdown');
  let n=3;$('#cdNum').textContent=n;
  clearInterval(cdTimer);
  cdTimer=setInterval(()=>{n--;if(n<=0){clearInterval(cdTimer);show(null);$('#pauseBtn').hidden=false;state='play'}else $('#cdNum').textContent=n},1000);
}
$('#pauseBtn').addEventListener('click',()=>{sfx.click();pauseGame()});
$('#pResume').addEventListener('click',resumeGame);
$('#pRestart').addEventListener('click',()=>{clearInterval(cdTimer);startGame()});
$('#pHome').addEventListener('click',()=>{clearInterval(cdTimer);G=null;toMenu()});

/* ====================================================================
   結算：頒獎典禮
   ==================================================================== */
let cer={timers:[],done:false,raf:0};
function calcScore(){
  const S=CONFIG.score;
  return Math.round(G.kills*S.kill+G.lv*S.level+Math.floor(G.t)*S.sec+G.maxCombo*S.combo+(G.win?S.win:0));
}
function endGame(win){
  if(G.over)return;G.over=true;G.win=win;
  state='result';$('#pauseBtn').hidden=true;joy.on=false;show('result');
  stopMusic(.6);playMusic('awards',0.8,.3,false);
  runCeremony();
}
function roll(el,to,ms,fmtFn){
  const t0=performance.now();cancelAnimationFrame(el._r);
  const f=()=>{const k=clamp((performance.now()-t0)/ms,0,1),v=Math.round(to*(1-Math.pow(1-k,3)));
    el.textContent=fmtFn?fmtFn(v):v.toLocaleString();if(k<1)el._r=requestAnimationFrame(f)};f();
}
function runCeremony(){
  const box=$('#resBox');box.innerHTML='';cer.timers.forEach(clearTimeout);cer.timers=[];cer.done=false;
  const score=calcScore(),step=CONFIG.ceremony.stepMs;
  const add=(html,cls)=>{const d=document.createElement('div');d.className=cls||'rrow';d.innerHTML=html;box.appendChild(d);return d};
  const acts=[
    i=>{add(`<div class="h2" style="font-size:38px">結果發表</div>`,'rtitle');
        add(`<div class="sub" style="align-self:center">${G.win?'撐過了整整 '+fmt(CONFIG.gameSeconds)+'！':'這次只撐到這裡，下次再來！'}</div>`,'rtitle')},
    i=>{const d=add(`<span>存活時間</span><b>0</b>`);roll(d.querySelector('b'),Math.floor(G.t),700,fmt)},
    i=>{const d=add(`<span>擊倒敵人</span><b>0</b>`);roll(d.querySelector('b'),G.kills,700)},
    i=>{const d=add(`<span>最高等級</span><b>0</b>`);roll(d.querySelector('b'),G.lv,600)},
    i=>{const d=add(`<span>最高連擊</span><b>0</b>`);roll(d.querySelector('b'),G.maxCombo,800)},
    i=>{add('恭喜你得到總分','congrats');const d=add('<span>0</span>','bigscore');roll(d.querySelector('span'),score,1700)}
  ];
  const finish=()=>{
    if(cer.done)return;cer.done=true;
    const btns=add(`<button class="btn gold small" id="againBtn">再玩一次</button><button class="btn small" id="homeBtn" data-back="1">回標題頁</button>`);btns.id='resBtns';btns.className='';
    $('#againBtn').addEventListener('click',()=>{sfx.click();stopMusic(.3);startGame()});
    $('#homeBtn').addEventListener('click',()=>{G=null;toMenu()});
    confettiBurst();
  };
  acts.forEach((a,i)=>{cer.timers.push(setTimeout(()=>{a(i);sfx.reveal(i);if(i===acts.length-1)cer.timers.push(setTimeout(finish,1900))},350+i*step+(i===acts.length-1?250:0)))});
  cer.skip=()=>{
    if(cer.done)return;cer.timers.forEach(clearTimeout);cer.timers=[];box.innerHTML='';
    acts.forEach((a,i)=>a(i));
    box.querySelectorAll('.rrow,.rtitle,.congrats,.bigscore').forEach(n=>n.style.animation='none');
    const vals=box.querySelectorAll('.rrow b');
    if(vals[0])vals[0].textContent=fmt(Math.floor(G.t));if(vals[1])vals[1].textContent=G.kills.toLocaleString();
    if(vals[2])vals[2].textContent=G.lv;if(vals[3])vals[3].textContent=G.maxCombo;
    const bs=box.querySelector('.bigscore span');if(bs){cancelAnimationFrame(bs._r);bs.textContent=score.toLocaleString()}
    sfx.reveal(6);finish();
  };
}
$('#result').addEventListener('click',e=>{if(e.target.closest('button'))return;if(state==='result'&&cer.skip)cer.skip()});

/* 彩帶 */
const cf=$('#confetti'),cfx=cf.getContext('2d');let confetti=[];
function confettiBurst(){
  const cols=['#ff5fae','#ffd54a','#6cc3ff','#7b5cd6','#8be0a8','#fff'];
  for(let i=0;i<150;i++)confetti.push({x:rnd(60,420),y:rnd(-40,40),vx:rnd(-140,140),vy:rnd(60,340),r:rnd(0,6),vr:rnd(-9,9),w:rnd(6,11),h:rnd(10,18),col:cols[i%6],life:rnd(3,5)});
  sfx.combo();
}
function drawConfetti(dt){
  cfx.setTransform(R,0,0,R,0,0);cfx.clearRect(0,0,W,H);
  if(!confetti.length)return;
  for(const p of confetti){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.vx*=.995;p.r+=p.vr*dt;p.life-=dt;
    cfx.save();cfx.translate(p.x,p.y);cfx.rotate(p.r);cfx.scale(1,Math.cos(p.r*1.7));cfx.fillStyle=p.col;cfx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cfx.restore()}
  confetti=confetti.filter(p=>p.life>0&&p.y<H+30);
}

/* ====================================================================
   主迴圈 & 縮放
   ==================================================================== */
function fit(){
  const s=Math.min(innerWidth/W,innerHeight/H);
  stage.style.transform='scale('+s+')';
}
addEventListener('resize',fit);fit();
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  ctx.setTransform(R,0,0,R,0,0);
  const inGame=G&&(state==='play'||state==='pause'||state==='levelup'||state==='countdown');
  BG[theme](ctx,T,inGame?G.x:T*6,inGame?G.y:0);
  if(inGame){
    if(state==='play')update(dt);
    if(G){drawFx(ctx);drawWorld(ctx);drawCheer(ctx);drawHud(ctx)}
  }else if(G&&state==='result'){
    drawFx(ctx);
  }
  drawConfetti(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* 測試用掛鉤 */
window.__game={get state(){return state},get G(){return G},set theme(v){theme=v},set mainId(v){mainId=v},settings,
  start:startGame,pause:pauseGame,resume:resumeGame,addXp:v=>addXp(v),end:endGame,
  hurt:hurtPlayer,kill1:()=>{const e={type:'dango',x:G.x+30,y:G.y,hp:1,maxHp:1,r:15,spd:0,dmg:0,xp:1,flash:0,ph:0,col:0,kx:0,ky:0,orbT:-9};G.en.push(e);hurtEnemy(e,5)},forceCombo:n=>{G.combo=n;G.maxCombo=Math.max(G.maxCombo,n);if(n>=CONFIG.combo.cheerAt)G.cheer.vis=true}};
})();
</script>
