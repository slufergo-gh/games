<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高塔狙擊手</title>
<style>
  :root { --amber:#e8c45a; --green:#7fd18b; --red:#e05a4a; --ink:#e8e2c8; --panel:rgba(10,14,10,.9); }
  html,body { margin:0; height:100%; background:#000; color:var(--ink); overflow:hidden;
    font-family:"Courier New","Noto Sans TC","Microsoft JhengHei",monospace; user-select:none; }
  #game { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #box { position:relative; background:#000; overflow:hidden; }
  #gl { width:100%; height:100%; display:block; image-rendering:pixelated; image-rendering:crisp-edges; }
  .ov { position:absolute; inset:0; pointer-events:none; }
  #scope { display:none; background:radial-gradient(circle closest-side, transparent 0 96%, #000 97%); }
  #scope::before, #scope::after { content:""; position:absolute; background:#000; }
  #scope::before { left:0; right:0; top:50%; height:2px; margin-top:-1px; }
  #scope::after { top:0; bottom:0; left:50%; width:2px; margin-left:-1px; }
  #scope .mil { position:absolute; left:50%; top:50%; width:8px; height:8px; margin:-4px 0 0 -4px; border-radius:50%; background:rgba(220,40,30,.9); }
  #scope .ring { position:absolute; left:50%; top:50%; border:1px solid rgba(220,40,30,.8); border-radius:50%; transform:translate(-50%,-50%); }
  #cross { position:absolute; left:50%; top:50%; border:2px solid rgba(232,226,200,.85); border-radius:50%; transform:translate(-50%,-50%); }
  #cross::after { content:""; position:absolute; left:50%; top:50%; width:4px; height:4px; margin:-2px 0 0 -2px; background:var(--ink); }
  #splat { opacity:0; transition:opacity .4s; }
  .hud { position:absolute; font-size:15px; text-shadow:2px 2px 0 #000; letter-spacing:1px; }
  #info { left:12px; top:10px; }
  #targets { right:12px; top:10px; text-align:right; font-size:13px; }
  #targets .t { margin-bottom:3px; }
  #targets .bar { display:inline-block; width:70px; height:6px; background:#333; vertical-align:middle; margin-left:6px; border:1px solid #000; }
  #targets .bar i { display:block; height:100%; background:var(--amber); }
  #ammo { right:12px; bottom:12px; text-align:right; width:200px; }
  #ammo .rounds { font-size:20px; color:var(--amber); }
  .pbar { display:flex; align-items:center; justify-content:flex-end; gap:6px; font-size:12px; margin-top:3px; }
  .pbar em { width:120px; height:7px; background:#333; border:1px solid #000; display:block; }
  .pbar em i { display:block; height:100%; }
  #breath { left:12px; bottom:14px; }
  #breath .bar { width:120px; height:7px; background:#333; border:1px solid #000; margin-top:4px; }
  #breath .bar i { display:block; height:100%; background:#8fc8ff; }
  #range { left:50%; top:calc(50% + 60px); transform:translateX(-50%); color:#ff7a6a; display:none; }
  #radio { left:136px; bottom:14px; max-width:46%; color:var(--green); }
  #msg { left:0; right:0; top:26%; text-align:center; font-size:30px; color:var(--amber); }
  #hitmark { left:50%; top:calc(50% - 46px); transform:translateX(-50%); font-size:18px; color:#fff; opacity:0; white-space:nowrap; }
  .menuon .ov, .menuon #cross, .menuon #radar { display:none !important; }
  #menu { position:absolute; inset:0; background:var(--panel); pointer-events:auto; overflow:auto; padding:18px 22px; box-sizing:border-box; }
  #menu h1 { margin:0 0 2px; color:var(--amber); font-size:30px; letter-spacing:4px; }
  #menu h2 { margin:14px 0 8px; font-size:16px; color:var(--green); letter-spacing:2px; }
  #menu .sub { color:#a9a48c; font-size:13px; line-height:1.6; }
  .guns { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .gun { border:2px solid #444; padding:7px 9px; cursor:pointer; background:rgba(0,0,0,.4); }
  .gun.on { border-color:var(--amber); background:rgba(232,196,90,.12); }
  .gun b { color:var(--amber); font-size:14px; }
  .gun small { display:block; color:#a9a48c; font-size:11px; margin:2px 0 4px; min-height:28px; }
  .stat { display:flex; align-items:center; font-size:11px; gap:6px; }
  .stat span { width:30px; }
  .stat em { flex:1; height:5px; background:#333; }
  .stat em i { display:block; height:100%; background:var(--green); }
  .cards { display:flex; gap:8px; flex-wrap:wrap; }
  .card { flex:1; min-width:150px; border:2px solid #555; padding:9px 11px; cursor:pointer; background:rgba(0,0,0,.4); }
  .card:hover { border-color:var(--amber); }
  .card b { color:var(--ink); font-size:16px; }
  .card small { display:block; color:#a9a48c; font-size:12px; margin-top:4px; line-height:1.5; }
  .keys { font-size:12px; color:#a9a48c; line-height:1.7; margin-top:12px; }
  .keys b { color:var(--ink); }
  .btn { display:inline-block; border:2px solid var(--amber); color:var(--amber); padding:6px 16px; margin:6px 6px 0 0; cursor:pointer; }
  .btn:hover { background:rgba(232,196,90,.15); }
  .btn.dim { border-color:#666; color:#aaa; }
  .form { display:grid; grid-template-columns:150px 1fr; gap:8px 12px; align-items:center; font-size:14px; }
  .form input[type=range] { width:200px; vertical-align:middle; }
  .form select { background:#111; color:var(--ink); border:1px solid #666; font:inherit; padding:2px 4px; }
  .types { display:grid; grid-template-columns:repeat(3, 1fr); gap:4px 10px; font-size:13px; }
  .types label, .form label { cursor:pointer; }
  #radar { position:absolute; top:auto; right:auto; left:12px; bottom:44px; width:112px; height:96px; pointer-events:none; }
  #alert { left:0; right:0; top:58px; text-align:center; font-size:18px; color:#ff5a4a; opacity:0; }
  .files { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .file { display:flex; gap:8px; border:1px solid #444; background:rgba(0,0,0,.45); padding:6px; }
  .file img { width:54px; height:72px; background:#2a2f2a; border:1px solid #555; image-rendering:pixelated; flex:none; }
  .file b { color:var(--amber); font-size:13px; }
  .file .no { color:#777; font-size:10px; }
  .file p { margin:3px 0 0; font-size:11px; color:#c9c3a8; line-height:1.5; }
  .tabs { display:flex; gap:6px; margin:12px 0 4px; flex-wrap:wrap; }
  .sc { position:relative; cursor:help; border-bottom:1px dotted; }
  .sc .tip { display:none; position:absolute; right:0; top:100%; z-index:20; width:230px; margin-top:4px; background:#fffaf0; color:#2b2416; padding:8px 10px;
    text-align:left; font-size:12px; font-weight:normal; line-height:1.7; box-shadow:0 4px 14px rgba(0,0,0,.5); }
  .sc:hover .tip { display:block; }
  .sc .tip div { display:flex; justify-content:space-between; }
  .rank { width:100%; border-collapse:collapse; font-size:14px; margin-top:8px; }
  .rank th { color:var(--amber); text-align:left; border-bottom:1px solid #555; padding:4px 6px; font-weight:normal; }
  .rank td { padding:4px 6px; border-bottom:1px dashed #444; color:#ddd6bc; }
  .rank td.s { color:#ffd25a; font-weight:bold; text-align:right; }
  .rank tr.me td { background:rgba(255,210,90,.15); }
  .rank .no1 { color:#ffd25a; } .rank .no2 { color:#d8d8d8; } .rank .no3 { color:#d0905a; }
  .tabs.small .tab { padding:2px 10px; font-size:13px; }
  #nameIn { background:#1a1d18; color:#f0e6c0; border:1px solid #666; padding:3px 8px; font:inherit; width:140px; }
  .tab { border:2px solid #555; padding:4px 14px; cursor:pointer; color:#aaa; }
  .tab.on { border-color:var(--amber); color:var(--amber); }
  .help { font-size:13px; line-height:1.9; }
  .help b { color:var(--amber); }
  .help p { margin:0 0 6px; }
  .gfiles { display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; }
  .file img.gimg { width:132px; height:44px; align-self:center; }
  #menu.titlebg { background:linear-gradient(180deg, rgba(10,14,10,.35) 0%, rgba(10,14,10,.55) 45%, rgba(10,14,10,.88) 100%); }
  .title { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; }
  .title .tag { color:#c9c3a8; font-size:13px; letter-spacing:4px; text-shadow:2px 2px 0 #000; }
  #menu .title h1.big { font-size:52px; letter-spacing:10px; margin:0; text-shadow:3px 3px 0 #000, 0 0 18px rgba(232,196,90,.35); }
  .title .lead { color:var(--ink); font-size:15px; line-height:1.8; text-shadow:2px 2px 0 #000; margin-bottom:6px; }
  .mlist { display:grid; grid-template-columns:repeat(3, 210px); gap:10px; }
  .mitem { border:2px solid #6b6650; background:rgba(0,0,0,.55); padding:10px 14px; cursor:pointer; text-align:left; }
  .mitem:hover { border-color:var(--amber); background:rgba(232,196,90,.14); }
  .mitem b { display:block; color:var(--amber); font-size:18px; letter-spacing:2px; }
  .mitem small { color:#a9a48c; font-size:12px; }
  .title .foot { margin-top:10px; color:#a9a48c; font-size:12px; text-shadow:1px 1px 0 #000; }
  .tlist { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px 12px; font-size:12px; color:#a9a48c; }
  .tlist b { color:var(--ink); }
  #rain { width:100%; height:100%; image-rendering:pixelated; display:none; }
  #flash { background:#fff; opacity:0; }
  #glare { opacity:0; }
  #bossbar { left:50%; top:10px; transform:translateX(-50%); text-align:center; font-size:14px; display:none; color:#ffb0a0; }
  #bossbar .bb { width:260px; height:9px; background:#333; border:1px solid #000; margin:4px auto 0; }
  #bossbar .bb i { display:block; height:100%; }
  #ammo .item { font-size:12px; color:#c9b0ff; margin-top:3px; }
  .items { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .icon { display:inline-block; width:26px; height:26px; line-height:26px; text-align:center; border:1px solid #6b6650; color:var(--amber); font-size:16px; margin-right:6px; vertical-align:middle; background:rgba(0,0,0,.4); }
  .mk { position:absolute; border:2px solid #ff4030; box-shadow:0 0 0 1px #000, inset 0 0 0 1px #000; transform:translate(-50%,-50%); }
  .mk span { position:absolute; bottom:100%; left:50%; transform:translateX(-50%); margin-bottom:2px; font-size:12px; color:#ff7a5a; text-shadow:1px 1px 0 #000; white-space:nowrap; }
  .mk.edge { border:none; box-shadow:none; color:#ff4030; font-size:22px; text-shadow:2px 2px 0 #000; }
  .mk.edge span { bottom:auto; top:100%; }
  #talk { left:50%; top:66%; transform:translateX(-50%); width:76%; text-align:center; font-size:16px; line-height:1.5; opacity:0; transition:opacity .25s; background:rgba(0,0,0,.55); padding:6px 12px; box-sizing:border-box; }
  #talk b { margin-right:6px; }
  #talk b.d { color:#ff6a50; } #talk b.g { color:#8fc8ff; }
  /* 典獄長評核報告 */
  .report { animation:rpIn .5s ease-out both; position:relative; max-width:700px; margin:0 auto; background:#ebe1c3; color:#2b2416; padding:16px 22px 14px; box-shadow:0 6px 22px rgba(0,0,0,.7); transform:rotate(-.4deg);
    font-family:"Courier New","Noto Serif TC","PMingLiU",serif; background-image:repeating-linear-gradient(0deg, transparent 0 25px, rgba(120,100,60,.12) 25px 26px); }
  .report .rh { text-align:center; border-bottom:2px solid #2b2416; padding-bottom:6px; font-size:13px; letter-spacing:3px; }
  .report .rh b { display:block; font-size:22px; letter-spacing:8px; margin-top:2px; }
  .report .rm { font-size:12px; margin:6px 0 8px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:4px 12px; }
  .report .rb { display:grid; grid-template-columns:1fr 210px; gap:14px; align-items:start; }
  .report table { width:100%; border-collapse:collapse; font-size:13px; }
  .report td { border-bottom:1px dashed rgba(43,36,22,.4); padding:3px 2px; }
  .report td:last-child { text-align:right; font-weight:bold; }
  .report .rt { margin-top:8px; font-size:14px; }
  .report .rt b { font-size:18px; color:#7a1c12; letter-spacing:2px; }
  .report .badge { display:inline-block; border:1px solid #2b2416; padding:0 6px; margin:2px 4px 0 0; font-size:12px; }
  .report .rc { margin-top:8px; font-size:14px; line-height:1.7; font-style:italic; }
  .report .rc .sg { display:block; text-align:right; font-style:normal; font-size:13px; }
  .photo { background:#f6f2e8; padding:7px 7px 24px; box-shadow:2px 3px 8px rgba(0,0,0,.45); transform:rotate(2.5deg); position:relative; margin-top:6px; }
  .photo img { width:100%; display:block; filter:sepia(.55) contrast(1.05); image-rendering:pixelated; background:#555; min-height:120px; }
  .photo .cap { position:absolute; left:8px; right:8px; bottom:4px; font-size:11px; color:#3a3020; text-align:center; font-style:italic; }
  .photo .clip { position:absolute; top:-10px; left:22px; width:14px; height:34px; border:3px solid #8a8a8a; border-radius:8px; }
  .stamp { position:absolute; right:30px; bottom:46px; border:3px solid #b8241c; color:#b8241c; font-size:28px; padding:2px 12px; letter-spacing:8px; transform:rotate(-14deg); opacity:.82; font-weight:bold; z-index:5; }

  @keyframes rpIn { from { transform:translateY(-60px) rotate(-3deg); opacity:0; } to { transform:rotate(-.4deg); opacity:1; } }
  @keyframes phIn { 0% { transform:scale(1.35) rotate(9deg); opacity:0; } 70% { transform:scale(.97) rotate(2deg); opacity:1; } 100% { transform:rotate(2.5deg); opacity:1; } }
  @keyframes stIn { 0% { transform:scale(2.6) rotate(-14deg); opacity:0; } 60% { transform:scale(.92) rotate(-14deg); opacity:.95; } 100% { transform:scale(1) rotate(-14deg); opacity:.82; } }
  @keyframes fdIn { from { opacity:0; } to { opacity:1; } }
  .report .photo { animation:phIn .45s ease-out .75s both; }
  .report .rt, .report .rc { animation:fdIn .35s ease-out 1.5s both; }
  .report .stamp { animation:stIn .3s ease-in 1.7s both; }
  .collage { position:relative; height:280px; }
  .collage .photo { position:absolute; width:150px; padding:5px 5px 20px; margin:0; }
  .collage .photo img { min-height:80px; }
  .collage .photo .cap { font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; bottom:3px; }
  .collage .photo:nth-child(1) { left:30px; top:0; z-index:3; width:178px; }
  .collage .photo:nth-child(2) { left:-6px; top:140px; z-index:2; width:140px; }
  .collage .photo:nth-child(3) { left:76px; top:160px; z-index:1; width:140px; }
  .photos { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:8px 0; }
  .photos .photo { width:120px; padding:5px 5px 18px; }
  .photos .photo img { min-height:60px; }
  .photos .photo .cap { font-size:10px; }
  /* 任務簡報 */
  .brief { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:8px; align-items:start; }
  .brief .help { margin:0; }
  .btypes { display:flex; flex-wrap:wrap; gap:6px; }
  .bt { width:62px; text-align:center; font-size:11px; color:#c9c3a8; }
  .bt img { width:54px; height:72px; background:#2a2f2a; border:1px solid #555; image-rendering:pixelated; display:block; margin:0 auto 2px; }
  .bt em { display:block; color:#ff6a50; font-style:normal; font-size:10px; }
  .bt { position:relative; cursor:help; }
  .bt:hover img { border-color:#ffd25a; }
  .bt .tip { display:none; position:absolute; left:0; top:100%; z-index:20; width:250px; margin-top:4px; background:#f1ead2; color:#2a2a3a; padding:8px 10px;
    text-align:left; font-size:13px; line-height:1.6; box-shadow:0 4px 14px rgba(0,0,0,.7); }
  .bt .tip span { display:block; text-align:right; font-size:11px; color:#7a1c12; }
  .bt:hover .tip { display:block; }
  .note { background:#f1ead2; color:#2a2a3a; padding:14px 18px; transform:rotate(.8deg); box-shadow:0 4px 14px rgba(0,0,0,.6); font-size:15px; line-height:26px;
    font-family:"Kaiti TC","DFKai-SB","BiauKai","STKaiti","KaiTi",cursive; background-image:repeating-linear-gradient(0deg, transparent 0 25px, rgba(70,90,160,.25) 25px 26px); }
  .note .nh { font-size:13px; color:#7a1c12; border-bottom:1px solid #7a1c12; margin-bottom:6px; }
  .note p { margin:0; }
  .mfoot { display:flex; justify-content:space-between; align-items:center; margin-top:14px; }
  .mfoot .btn { margin:0; }
  .btn.go { font-size:18px; padding:8px 26px; }
  .items .gun b { display:flex; align-items:center; white-space:nowrap; }
  .items .gun small { min-height:0; }
  #pause { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:rgba(0,0,0,.62); pointer-events:auto; }
  #pause h1 { color:var(--amber); letter-spacing:6px; margin:0 0 8px; }
  #pause .mitem { width:240px; text-align:center; }
  .file .icon { width:54px; height:54px; line-height:54px; font-size:28px; flex:none; margin:0; }
</style>
</head>
<body>
<div id="game"><div id="box">
  <canvas id="gl"></canvas>
  <canvas id="rain" class="ov" width="200" height="150"></canvas>
  <div id="scope" class="ov"><div class="mil"></div><div class="ring" id="sring"></div></div>
  <div id="cross"></div>
  <div id="splat" class="ov"></div>
  <div id="glare" class="ov"></div>
  <div id="marks" class="ov"></div>
  <div id="flash" class="ov"></div>
  <canvas id="radar" class="ov" width="112" height="96"></canvas>
  <div class="ov">
    <div id="info" class="hud"></div>
    <div id="targets" class="hud"></div>
    <div id="ammo" class="hud"></div>
    <div id="breath" class="hud">屏息<div class="bar"><i id="breathbar"></i></div></div>
    <div id="range" class="hud"></div>
    <div id="radio" class="hud"></div>
    <div id="msg" class="hud"></div>
    <div id="hitmark" class="hud"></div>
    <div id="alert" class="hud"></div>
    <div id="bossbar" class="hud"></div>
    <div id="talk" class="hud"></div>
  </div>
  <div id="pause"></div>
  <div id="menu"></div>
</div></div>
<script src="assets/lib/three.min.js"></script>
<script>
(() => {
'use strict';
// ================= 基本設定 =================
const RW = 400, RH = 300;               // 內部解析度（PS1 風格低解析）
const FOV = 55, EYE = new THREE.Vector3(0, 21, 7);
const ESCAPE_Z = -250;                   // 跑進森林就算逃脫
const WALL_H = 6.2;
const box = document.getElementById('box'), cvs = document.getElementById('gl');
const $ = id => document.getElementById(id);
function fit() {
  const w = Math.min(innerWidth, innerHeight * 4 / 3), h = w * 3 / 4;
  box.style.width = w + 'px'; box.style.height = h + 'px';
}
addEventListener('resize', fit); fit();

const renderer = new THREE.WebGLRenderer({ canvas: cvs, antialias: false });
renderer.setPixelRatio(1); renderer.setSize(RW, RH, false);
const camera = new THREE.PerspectiveCamera(FOV, 4 / 3, 0.1, 800);
camera.rotation.order = 'YXZ';

// ================= 槍械 =================
// dmg 對耐力的傷害；spread 散布(度)；sway 晃動倍率；bolt 每發間隔(秒)；reload 換彈(秒)；speed 彈速(m/s，0=瞬間)
const GUNS = [
  { id:'m24',  name:'M-24R 哨兵', note:'標準狙擊槍，各項平衡', dmg:50, pellets:1, mag:5,  bolt:1.1, reload:2.6, spread:.10, sway:1.0, speed:520, kick:1.2, color:0x2b2f2a },
  { id:'gl79', name:'GL-79 雷鳴', note:'榴彈槍，落點炸開小範圍麻醉氣，範圍穩定、威力高，換彈最慢之一', dmg:120, pellets:1, mag:4, bolt:1.6, reload:4.8, spread:.12, sway:1.25, speed:0, blast:5, kick:2.6, color:0x3a3524 },
  { id:'lx9',  name:'LX-9 光矛',  note:'實驗型雷射，瞬間命中、極精準，只有兩發', dmg:130, pellets:1, mag:2, bolt:2.2, reload:4.2, spread:.02, sway:.8, speed:0, kick:.6, color:0x9aa3ad },

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const D2R = Math.PI / 180;
const SUN_YAW = 24 * D2R, SUN_EL = 5 * D2R;   // 日出關太陽的方位
const SUN_DIR = new THREE.Vector3(-Math.sin(SUN_YAW) * Math.cos(SUN_EL), Math.sin(SUN_EL), -Math.cos(SUN_YAW) * Math.cos(SUN_EL));
function heightAt(x, z) {
  if (z > -15 || z < -215) return 0;
  const k = Math.min(1, (-15 - z) / 25) * Math.min(1, (z + 215) / 25);

    if (c < 1.7) { p.g.position.set(p.x, (c / 1.7) * (WALL_H - .3), 1.05); const s = Math.sin(c * 10); setLimbs(p, s * .5, -s * .5, -2.8 + s * .4, -2.8 - s * .4); }
    else if (c < 2.1) { const k = (c - 1.7) / .4; p.z = 1.05 - k * 2.3; p.g.position.set(p.x, WALL_H - .3 + Math.sin(k * Math.PI) * .8, p.z); setLimbs(p, -.8, -.8, -1.5, -1.5); }
    else if (c < 2.55) { const k = (c - 2.1) / .45; p.z = -1.25 - k * 1.6; p.g.position.set(p.x, (WALL_H - .3) * (1 - k * k), p.z); setLimbs(p, .4, -.4, -2, -2); }
    else { p.state = 'run'; p.g.position.y = 0; if (p.rope) { const r = p.rope; setTimeout(() => scene.remove(r), 3000); p.rope = null; } planPath(p); }
    return;
  }
  if (p.state === 'stumble') {
    p.timer -= dt; p.g.rotation.z = Math.sin(p.timer * 30) * .2;
    if (p.timer <= 0) { p.g.rotation.z = 0; p.state = 'run'; }
    return;
  }
  if (p.state === 'hide') {
    p.timer -= dt; p.g.scale.y = p.T.scale * .62; setLimbs(p, .5, .5, -.3, -.3);
    if (p.timer <= 0) { p.g.scale.y = p.T.scale; p.state = 'run'; p.i++; }
    return;
  }
  if (p.state === 'show') return updateShow(p, dt);
  if (p.state === 'pray') {
    p.timer -= dt; setLimbs(p, 0, 0, -3, -3);
    if (p.timer <= 0) { healAround(p); p.state = 'run'; }
    return;
  }
  if (p.state === 'bats') return updateBatPhase(p, dt);
  if (p.state === 'charm') {
    p.timer -= dt; setLimbs(p, 0, 0, -2.6, -2.6); p.g.rotation.x = 0; p.g.rotation.y += dt * 3;
    if (Math.random() < dt * 8) puff(new THREE.Vector3(p.x + rand(-2, 2), p.g.position.y + rand(1, 4), p.z), 0xff6ad0, .8, .8);
    if (p.timer <= 0) p.state = 'run';
    return;
  }
  // 惡魔兵：排成隊跟在惡魔腳邊
  if (p.escort) {
    if (!boss) return;
    const tx = boss.x + p.escort.ox, tz = boss.z + p.escort.oz, d = Math.hypot(tx - p.x, tz - p.z);
    walk(p, tx, tz, d < .3 ? 0 : Math.min(8, Math.max(1.8, d * 1.5)) * p.legMul, dt);
    return;
  }
  // 被魅魔迷住：往她身邊跑，靠近就變成護衛

    const s = p.charm;
    if (!active(s) || s.hidden || s.state === 'inCar') { p.charm = null; planPath(p); }
    else { if (walk(p, s.x, s.z + 2, p.T.speed * 1.4 * p.legMul * zombieSlow(p), dt) < 4) convertGuard(p, s); return; }
  }
  // 護衛：跟在魅魔前面
  if (p.master) {
    const s = p.master;
    if (!active(s) || s.state === 'inCar') { p.master = null; planPath(p); radio(`${p.id} 號（護衛）醒過來，自己往森林跑了！`); }
    else {
      const tx = s.x + (p.slot ? 3.2 : -3.2), tz = s.z + 3.5, d = Math.hypot(tx - p.x, tz - p.z);
      walk(p, tx, tz, d < .3 ? 0 : Math.min(10, Math.max(s.T.speed, d * 1.6)) * p.legMul, dt);
      return;
    }
  }

  // ---- 特殊能力 ----
  if (p.smoke !== null && p.z < p.smoke) { spawnSmoke(p.x + rand(-1.5, 1.5), p.z + 5); radio(`${p.id} 號丟出煙霧彈！`); p.smoke = null; }
  p.abT -= dt;
  if (p.z < -18 && p.z > ESCAPE_Z + 30 && p.abT <= 0) {
    if (p.type === 'fraud' && p.decoys < (abilityF < 1 ? 2 : 3)) {
      p.decoys++; p.abT = rand(5, 7);
      spawnDecoy(p); p.boost = 2.5;
      p.path.splice(p.i, 0, { x: clamp(p.x + (Math.random() < .5 ? -1 : 1) * rand(16, 26), -150, 150), z: p.z - 14 });
      stats.abil++; radio(`${p.id} 號（詐欺犯）立起了人形立牌！`); return;
    }
    if (p.type === 'clown') { p.abT = rand(10, 13); startShow(p); return; }
    if (p.type === 'priest') { p.abT = rand(7, 9); p.state = 'pray'; p.timer = 1.2; return; }
    if (p.type === 'psychic') { p.abT = rand(10, 12); raiseShield(p); }
    if (p.type === 'vampire' && p.batDone < 2 && p.z < -45 - p.batDone * 80) { p.batDone++; p.abT = 3; startBats(p); return; }
    if (p.type === 'succubus' && p.guards.filter(active).length < 2 && charmNearby(p)) return;
  }

  const wp = p.path[p.i];
  if (!wp) {
    if (p.car) { p.state = 'inCar'; p.g.visible = false; boardCar(p.car, p); }
    else p.state = 'escaped';
    return;
  }
  const dist = Math.hypot(wp.x - p.x, wp.z - p.z);
  if (dist < .6) { if (wp.wait) { if (p.wolf) p.wolf.dash = false; p.state = 'hide'; p.timer = wp.wait; wp.wait = 0; } else p.i++; return; }
  if (p.boost > 0) p.boost -= dt;
  // 狼人：走一段 → 衝刺一段
  let wolfMul = 1;
  if (p.wolf && p.z < -8) {
    const w = p.wolf; w.t -= dt;
    if (w.t <= 0) {
      w.dash = !w.dash; w.t = w.dash ? 1.4 * abilityF : rand(4, 6);
      if (w.dash) { SFX.howl(); if (!p.wolfForm) toWolf(p); if (!w.told) { w.told = true; radio(`${p.id} 號（狼人）變身衝刺！等他停下來再打！`); } }
    }
    if (w.dash) { wolfMul = 12 / p.T.speed; w.dust = (w.dust || 0) - dt;
      if (w.dust <= 0) { w.dust = .12; puff(new THREE.Vector3(p.x, heightAt(p.x, p.z) + .5, p.z), 0x8a7a5a, 1.2, .6); } }
  }
  const tired = p.sta < p.maxSta * .5 ? .8 : 1;
  const sp = p.T.speed * p.legMul * p.speedMul * tired * wolfMul * zombieSlow(p) * (p.boost > 0 ? 1.35 : 1) * (p.shield ? .6 : 1);
  walk(p, wp.x, wp.z, sp, dt);
  if (p.wolf && p.wolf.dash) p.g.rotation.x = .5;
  if (p.z <= ESCAPE_Z) p.state = 'escaped';
}
// 朝目標走一步（含走路動作），回傳剩下的距離
function walk(p, tx, tz, sp, dt) {
  const dx = tx - p.x, dz = tz - p.z, dist = Math.hypot(dx, dz);
  const st = Math.min(dist, sp * dt);
  if (st > 1e-4) { p.x += dx / dist * st; p.z += dz / dist * st; p.g.rotation.y = Math.atan2(dx, dz); p.phase += sp / p.T.scale * dt * 2.1; }
  p.g.position.set(p.x, heightAt(p.x, p.z), p.z);
  const sw = st > 1e-4 ? Math.sin(p.phase) * clamp(sp / 5, .5, 1) * .9 : 0;
  setLimbs(p, sw, -sw, -sw * .9, sw * .9);
  p.g.rotation.x = st > 1e-4 ? .12 : 0; p.g.position.y += Math.abs(Math.sin(p.phase)) * .08 * p.T.scale * (st > 1e-4 ? 1 : 0);
  return dist - st;
}
// 魅魔：迷住附近的人
function charmNearby(s) {
  const R = 30 * abilityF, room = 2 - s.guards.filter(active).length - prisoners.filter(q => q.charm === s && active(q)).length;
  const cand = prisoners.filter(q => q !== s && active(q) && !q.hidden && !q.charm && !q.master && q.type !== 'succubus' && q.type !== 'guard'
      && (q.state === 'run' || q.state === 'hide' || q.state === 'stumble') && Math.hypot(q.x - s.x, q.z - s.z) < R)
    .sort((a, b) => Math.hypot(a.x - s.x, a.z - s.z) - Math.hypot(b.x - s.x, b.z - s.z)).slice(0, Math.max(0, room));
  if (!cand.length) { s.abT = 2.5; return false; }
  s.abT = rand(9, 11); s.state = 'charm'; s.timer = 1.6; SFX.charm();
  cand.forEach(q => { q.charm = s; if (q.state === 'hide') { q.g.scale.y = q.T.scale; q.state = 'run'; } if (q.wolf) q.wolf.dash = false; addSprite(q, 'heart', 3); });
  radio(`${s.id} 號（魅魔）迷住了 ${cand.length} 個人！他們往她身邊跑過去了！`);
  return true;
}
function convertGuard(q, s) {
  scene.remove(q.g); removeColliders(c => c.userData.p === q);
  if (q.shield) dropShield(q);
  if (q.car) { q.car.reserved = false; q.car = null; }
  const b = buildBody('guard', map.dark);
  Object.assign(q, b);
  q.type = 'guard'; q.T = PTYPES.guard; q.maxSta = q.sta = PTYPES.guard.sta * hpMul;
  q.charm = null; q.master = s; q.slot = s.guards.filter(active).length % 2; q.wolf = null; q.smoke = null; q.sprite = null;
  q.legMul = 1; q.speedMul = 1; q.boost = 0; q.state = 'run';
  q.parts.forEach(m => { addCollider(m, 'prisoner'); m.userData.p = q; });
  q.g.position.set(q.x, heightAt(q.x, q.z), q.z); scene.add(q.g);
  s.guards.push(q); stats.abil++;
  puff(new THREE.Vector3(q.x, 3, q.z), 0xff6ad0, 4, 1); SFX.charm();
  radio(`${q.id} 號變成魅魔的護衛了！先打倒護衛！`);
}

// 吸血鬼：蝙蝠

function updateBatPhase(p, dt) {

function boardCar(car, p) {
  car.driver = p; car.state = 'drive';

  radio(p.sta > p.maxSta * .5 ? `${p.id} 號上車了！車子很難攔，快打！` : `${p.id} 號帶傷上車，車子撐不久！`);
}
function updateCar(c, dt) {
  c.t += dt;
  if (c.state === 'wait') { c.g.position.y = Math.sin(c.t * 40) * .02; return; }
  if (c.state === 'drive') {
    c.v = Math.min(c.v + 7 * dt, 21);
    c.x += c.dir * c.v * dt; c.g.position.x = c.x;
    c.wheels.forEach(w => w.rotation.x += c.v * dt * 2);
    if (Math.abs(c.x) > 200) { c.state = 'gone'; c.driver.state = 'escaped'; }
  }
  if (c.state === 'stopped') {
    c.v = Math.max(0, c.v - 18 * dt); c.x += c.dir * c.v * dt; c.g.position.x = c.x;
    c.smokeT -= dt;
    if (c.smokeT <= 0) { c.smokeT = .15; puff(new THREE.Vector3(c.x, 3, c.z), 0x333333, 1.6, 1.4); }
  }
}
function hitCar(c, dmg, quiet) {

  c.hp -= dmg; if (!quiet) { stats.hits++; showHit('命中車輛'); SFX.hit(); }

    p.x = c.x; p.z = c.z + 4; p.g.position.set(p.x, 0, p.z); knockDown(p);

}

// ================= 射擊 =================

function itemHud() {

  const sun = new THREE.DirectionalLight(0xfff0d0, .8); sun.position.set(2, 4, 5); sc.add(sun);
  const cam = new THREE.PerspectiveCamera(30, 54 / 72, .1, 50);
  const out = {};
  for (const k of Object.keys(PTYPES)) {
    const b = buildBody(k);
    b.g.scale.setScalar(1); b.g.rotation.y = .5;
    b.legL.rotation.x = .35; b.legR.rotation.x = -.35; b.armL.rotation.x = -.4; b.armR.rotation.x = .4;
    sc.add(b.g);
    cam.position.set(0, 1.15, 4.6); cam.lookAt(0, 1.05, 0);
    r.render(sc, cam);
    out[k] = r.domElement.toDataURL();
    sc.remove(b.g);
  }
  const d = buildDemon(); d.g.rotation.y = .5; sc.add(d.g);
  cam.position.set(0, 1.4, 6.6); cam.lookAt(0, 1.35, 0);
  r.render(sc, cam); out.demon = r.domElement.toDataURL(); sc.remove(d.g);
  // 槍械側面圖
  r.setSize(132, 44);
  sc.background = new THREE.Color(0x7c8576);
  const gcam = new THREE.PerspectiveCamera(20, 132 / 44, .1, 50);
  gcam.position.set(0, .15, 4.2); gcam.lookAt(0, 0, 0);
  const gout = {};
  for (const gun of GUNS) {
    const m = makeGunModel(gun);
    m.scale.setScalar(1); m.position.set(0, 0, 0); m.rotation.set(0, Math.PI / 2, 0);
    m.position.x = gun.id === 'gl79' ? .5 : .85;
    sc.add(m); r.render(sc, gcam); gout[gun.id] = r.domElement.toDataURL(); sc.remove(m);
