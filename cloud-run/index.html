<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雲朵王國跑酷</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f0fa;--fg:#2a2340;--btn:#7b5cd6;--btnfg:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14111d;--fg:#ece8f6;--btn:#b79cff;--btnfg:#14111d}}
:root[data-theme="dark"]{--bg:#14111d;--fg:#ece8f6;--btn:#b79cff;--btnfg:#14111d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px 10px}
canvas{width:100%;max-width:480px;border-radius:14px;touch-action:none;display:block}
button{margin-top:14px;padding:10px 28px;font-size:18px;border:0;border-radius:999px;background:var(--btn);color:var(--btnfg);cursor:pointer}
p{max-width:480px;font-size:14px;margin:12px 0 0;opacity:.8;text-align:center}
</style>
</head>
<body>
<canvas id="c" width="480" height="700"></canvas>
<button id="start">開始</button>
<p>按鍵：F 獨角獸　J 雞（也可直接點擊／觸碰該跑道）。小蛋糕到達粉紅線時按一下；長條冰淇淋到達粉紅線時按住，直到冰淇淋結束再放開。</p>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=480,H=700,TX=60,LW=180,TW=360,HY=560,SPB=0.6,SPD=200;
const ANIM=['🦄','🐔'],KEYS=['f','j'];
const CHART=[[4,0,0],[5,1,0],[6,0,0],[7,1,0],[8,0,2],[10,1,0],[11,0,0],[12,1,3],[13,0,0],[14,0,0],
[16,0,0],[16,1,0],[18,0,2],[18,1,2],[21,0,0],[22,1,0],[23,0,0],[24,1,0],[25,0,2],[25,1,0],[26,1,0],
[28,0,0],[28,1,0],[29,0,0],[30,1,0],[31,0,0]];
let notes=[],st={p:0,g:0,m:0},combo=0,maxCombo=0,pressed=[0,0],pressAt=[0,0],jumpAt=[-9,-9],label='',labelAt=-9,t0=0,running=false,over=false,endT=0;
const now=()=>(performance.now()-t0)/1000-2;
const yOf=(time,t)=>HY-(time-t)*SPD;
const cxOf=l=>TX+l*LW+LW/2;
const mod=(v,m)=>((v%m)+m)%m;
function rr(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h);}
// background decoration
const clouds=Array.from({length:9},(_,i)=>({x:(i*97)%W,y:(i*83)%H,s:18+(i*7)%16,sp:14+(i*5)%12}));
const stars=Array.from({length:28},(_,i)=>({x:(i*131)%W,y:(i*173)%H,r:3+(i%3)*2}));
function reset(){
  notes=CHART.map(([b,l,n])=>({lane:l,time:b*SPB,end:(b+n)*SPB,len:n,done:false,hold:false,bad:false}));
  endT=Math.max(...notes.map(n=>n.end))+1.5;
  st={p:0,g:0,m:0};combo=0;maxCombo=0;pressed=[0,0];over=false;running=true;t0=performance.now();label='';
}
function miss(){st.m++;combo=0;label='MISS';labelAt=now();}
function press(l){
  if(!running||pressed[l])return;
  const t=now();pressed[l]=1;pressAt[l]=t;jumpAt[l]=t;
  let best=null;
  for(const n of notes)if(n.lane===l&&!n.done&&!n.hold&&Math.abs(t-n.time)<=0.18&&(!best||Math.abs(t-n.time)<Math.abs(t-best.time)))best=n;
  if(!best)return;
  const d=Math.abs(t-best.time);
  if(d<=0.08){st.p++;label='PERFECT';}else{st.g++;label='GOOD';}
  labelAt=t;combo++;maxCombo=Math.max(maxCombo,combo);
  if(best.len===0)best.done=true;else best.hold=true;
}
function release(l){
  if(!pressed[l])return;pressed[l]=0;
  const t=now();
  for(const n of notes)if(n.lane===l&&n.hold){
    n.hold=false;n.done=true;
    if(t<n.end-0.15){n.bad=true;miss();}
  }
}
function update(t){
  for(const n of notes){
    if(!n.done&&!n.hold&&t-n.time>0.18){n.done=true;n.bad=true;miss();}
    if(n.hold&&t>=n.end){n.hold=false;n.done=true;}
  }
  if(t>endT){running=false;over=true;}
}
function draw(t){
  const ct=performance.now()/1000;
  // sky
  const bg=g.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#c7b8ff');bg.addColorStop(.5,'#ffc8ec');bg.addColorStop(1,'#bfe6ff');
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  // sparkles
  g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';
  stars.forEach((s,i)=>{g.globalAlpha=.4+.6*Math.abs(Math.sin(ct*1.5+i));g.font=(s.r*3)+'px sans-serif';g.fillText('✦',s.x,s.y);});
  g.globalAlpha=1;
  // clouds drifting downward
  clouds.forEach(c=>{
    const y=mod(c.y+ct*c.sp,H+120)-60,s=c.s;
    g.fillStyle='rgba(255,255,255,.7)';
    [[0,0,s],[s*.9,-s*.25,s*.8],[-s*.9,s*.1,s*.7],[s*1.7,s*.2,s*.6]].forEach(([dx,dy,r])=>{g.beginPath();g.arc(c.x+dx,y+dy,r,0,7);g.fill();});
  });
  // track
  g.fillStyle='rgba(255,255,255,.35)';rr(TX,0,TW,H,0);g.fill();
  g.fillStyle='rgba(255,255,255,.18)';g.fillRect(TX+LW,0,LW,H);
  // grid lines: one per beat, stronger every 4 beats
  const first=Math.floor((t-(H-HY)/SPD)/SPB),last=Math.ceil((t+HY/SPD)/SPB);
  for(let b=first;b<=last;b++){
    const y=yOf(b*SPB,t);
    g.strokeStyle=b%4===0?'rgba(255,255,255,.95)':'rgba(255,255,255,.5)';
    g.lineWidth=b%4===0?2:1;
    g.beginPath();g.moveTo(TX,y);g.lineTo(TX+TW,y);g.stroke();
  }
  g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=2;
  g.beginPath();g.moveTo(TX+LW,0);g.lineTo(TX+LW,H);g.stroke();
  // notes
  for(const n of notes){
    if(n.done&&!n.bad)continue;
    const cx=cxOf(n.lane);
    g.globalAlpha=n.bad?0.35:1;
    if(n.len>0){
      const yTop=yOf(n.end,t),yBot=n.hold?Math.min(yOf(n.time,t),HY):yOf(n.time,t);
      if(yBot<0||yTop>H){g.globalAlpha=1;continue;}
      const bx=cx-36,bh=yBot-yTop;
      g.fillStyle='#ff8fbf';rr(bx,yTop,72,bh,30);g.fill();
      g.strokeStyle='#fff';g.lineWidth=3;g.stroke();
      g.fillStyle='rgba(255,255,255,.55)';rr(bx+12,yTop+12,10,Math.max(bh-24,0),5);g.fill();
      const sp=['#ffd54a','#6cc3ff','#fff','#9b7bff'];
      for(let wy=yTop+22,k=0;wy<yBot-14;wy+=30,k++){g.fillStyle=sp[k%4];g.beginPath();g.arc(cx+(k%2?12:-4)+8,wy,4,0,7);g.fill();}
    }else{
      const y=yOf(n.time,t);
      if(y>-40&&y<H+40){g.font='42px sans-serif';g.fillStyle='#000';g.fillText('🧁',cx,y);}
    }
    g.globalAlpha=1;
  }
  // hit line
  g.save();g.shadowColor='#ff5fae';g.shadowBlur=12;
  g.strokeStyle='#ff5fae';g.lineWidth=4;
  g.beginPath();g.moveTo(TX,HY);g.lineTo(TX+TW,HY);g.stroke();g.restore();
  // animals
  for(let l=0;l<2;l++){
    const cx=cxOf(l);
    let dy=running?Math.sin(t*14+l)*3:0,sc=1;
    const p=(t-jumpAt[l])/0.35;
    if(p>=0&&p<1){const s=Math.sin(Math.PI*p);dy-=s*28;sc=1+.25*s;}
    const swim=pressed[l]&&t-pressAt[l]>0.12;
    if(swim){dy=6+Math.sin(t*10)*2;g.font='28px sans-serif';g.fillText('🍦',cx,HY+34);}
    g.save();g.translate(cx,HY+dy);g.scale(sc,sc);
    g.font='54px sans-serif';g.fillText(ANIM[l],0,0);g.restore();
    g.fillStyle='rgba(123,92,214,.9)';g.beginPath();g.arc(cx,HY+95,18,0,7);g.fill();
    g.fillStyle='#fff';g.font='bold 18px sans-serif';g.fillText(KEYS[l].toUpperCase(),cx,HY+96);
  }
  // HUD
  g.fillStyle='#3b2a78';g.font='bold 18px sans-serif';g.textBaseline='middle';
  g.textAlign='left';g.fillText('Combo '+combo,12,22);
  g.textAlign='right';g.fillText('P '+st.p+'  G '+st.g+'  M '+st.m,W-12,22);
  if(label&&t-labelAt<0.5){g.textAlign='center';g.font='bold 26px sans-serif';g.fillText(label,W/2,60);}
  if(running&&t<0){g.textAlign='center';g.font='bold 90px sans-serif';g.fillStyle='rgba(255,255,255,.95)';g.fillText(Math.ceil(-t),W/2,300);}
  if(over){
    g.fillStyle='rgba(60,40,110,.7)';g.fillRect(0,0,W,H);
    g.fillStyle='#fff';g.textAlign='center';g.font='bold 36px sans-serif';g.fillText('結束',W/2,250);
    g.font='22px sans-serif';
    g.fillText('PERFECT '+st.p+'　GOOD '+st.g+'　MISS '+st.m,W/2,320);
    g.fillText('最高連擊 '+maxCombo,W/2,360);
  }
  if(!running&&!over){
    g.fillStyle='rgba(60,40,110,.45)';g.fillRect(0,0,W,H);
    g.fillStyle='#fff';g.textAlign='center';g.font='bold 30px sans-serif';g.fillText('按下「開始」',W/2,300);
  }
}
function loop(){
  requestAnimationFrame(loop);
  const t=(running||over)?(over?endT:now()):-2;
  if(running)update(t);
  draw(running||over?t:0);
}
loop();
document.getElementById('start').onclick=function(){reset();this.textContent='重新開始';this.blur();};
addEventListener('keydown',e=>{const l=KEYS.indexOf(e.key.toLowerCase());if(l>=0&&!e.repeat)press(l);});
addEventListener('keyup',e=>{const l=KEYS.indexOf(e.key.toLowerCase());if(l>=0)release(l);});
const pm={};
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,l=Math.floor((x-TX)/LW);
  if(l>=0&&l<2){pm[e.pointerId]=l;press(l);}
});
const up=e=>{if(pm[e.pointerId]!==undefined){release(pm[e.pointerId]);delete pm[e.pointerId];}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
</script>
</body>
</html>
